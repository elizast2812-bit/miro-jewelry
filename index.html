<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<meta name="mobile-web-app-capable" content="yes"/>
<meta name="apple-mobile-web-app-capable" content="yes"/>
<title>Miro Jewelry</title>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet"/>
<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
:root{
  --red:#C0392B;--red-pale:#FDF1F0;
  --gold:#C9A96E;--gold-l:#F5EDD8;
  --dark:#1A1A1A;--mid:#4A4A4A;--muted:#8A8A8A;
  --border:#E8E0D8;--bg:#FAF8F5;--white:#FFF;
  --green:#27AE60;--green-p:#EAF7EE;
  --safe-b:env(safe-area-inset-bottom,0px);
}
html,body{min-height:100vh;background:var(--bg);font-family:'Inter',sans-serif;color:var(--dark)}
#app{display:flex;flex-direction:column;min-height:100vh}

/* Header (mobile only) */
.header{background:var(--dark);padding:14px 18px;display:flex;align-items:center;justify-content:space-between;flex-shrink:0}
.logo-title{font-family:'Cormorant Garamond',serif;font-size:22px;font-weight:700;color:#fff;letter-spacing:1px}
.logo-sub{font-size:9px;color:var(--gold);letter-spacing:3px;text-transform:uppercase;margin-top:1px}
.header-right{display:flex;flex-direction:column;align-items:flex-end;gap:4px}
.header-btn{background:var(--red);color:#fff;border:none;border-radius:8px;padding:7px 14px;font-size:12px;font-weight:600;cursor:pointer;display:none}
#sync-h{font-size:10px;color:#888}

/* Scroll */
.scroll{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;padding:16px 16px calc(76px + var(--safe-b))}

/* Bottom nav (mobile) */
.bnav{position:fixed;bottom:0;left:0;right:0;background:var(--dark);display:flex;padding:8px 0 calc(6px + var(--safe-b));z-index:50;border-top:1px solid #2a2a2a}
.ni{flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;cursor:pointer;padding:3px 0}
.ni-icon{font-size:20px;line-height:1}
.ni-label{font-size:10px;color:#666;font-weight:500}
.ni.active .ni-label{color:var(--gold)}

/* Desktop */
@media(min-width:768px){
  #app{flex-direction:row}
  .header{display:none}
  .bnav{position:fixed;left:0;top:0;bottom:0;width:210px;flex-direction:column;padding:0;border-top:none;border-right:1px solid #2a2a2a;justify-content:flex-start}
  .bnav::before{content:'miro';font-family:'Cormorant Garamond',serif;font-size:22px;font-weight:700;color:#fff;letter-spacing:1px;padding:26px 24px 2px;display:block}
  .bnav::after{content:'JEWELRY PLATFORM';font-size:9px;color:var(--gold);letter-spacing:3px;padding:0 24px 18px;display:block;border-bottom:1px solid #2a2a2a;margin-bottom:6px}
  .ni{flex:none;flex-direction:row;padding:13px 24px;gap:12px;justify-content:flex-start;border-left:3px solid transparent}
  .ni.active{background:#252525;border-left-color:var(--gold)}
  .ni-icon{font-size:17px}
  .ni-label{font-size:13px;color:#888}
  .ni.active .ni-label{color:#fff}
  .scroll{margin-left:210px;padding:28px 32px 40px}
  .stats-grid{grid-template-columns:repeat(4,1fr)!important}
  .modal-backdrop{align-items:center}
  .modal{border-radius:16px;max-width:620px;margin:auto}
  #sync-d{display:block!important}
}

/* Cards */
.card{background:var(--white);border:1px solid var(--border);border-radius:14px;padding:16px;margin-bottom:14px}
.card-title{font-size:11px;font-weight:600;color:var(--muted);letter-spacing:1px;text-transform:uppercase;margin-bottom:12px}

/* Stats */
.stats-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:14px}
.stat{background:var(--white);border:1px solid var(--border);border-radius:14px;padding:14px}
.stat-label{font-size:10px;color:var(--muted);text-transform:uppercase;letter-spacing:.5px;margin-bottom:6px}
.stat-value{font-family:'Cormorant Garamond',serif;font-size:26px;font-weight:700}
.stat-sub{font-size:10px;color:var(--green);margin-top:2px}

/* Buttons */
.btn{display:inline-flex;align-items:center;gap:6px;padding:10px 18px;border-radius:10px;font-size:13px;font-weight:600;cursor:pointer;border:none;font-family:'Inter',sans-serif}
.btn-red{background:var(--red);color:#fff;width:100%;justify-content:center;padding:13px}
.btn-gold{background:var(--gold);color:#fff;width:100%;justify-content:center;padding:13px}
.btn-outline{background:transparent;border:1.5px solid var(--border);color:var(--mid);padding:9px 16px}
.btn-sm{padding:6px 13px;font-size:12px}
.btn-x{background:transparent;border:none;font-size:18px;cursor:pointer;color:var(--muted);padding:4px;line-height:1}

/* Forms */
.fg{margin-bottom:13px}
.fg label{display:block;font-size:11px;font-weight:600;color:var(--mid);margin-bottom:4px;text-transform:uppercase;letter-spacing:.5px}
.fi{width:100%;padding:11px 13px;border:1.5px solid var(--border);border-radius:10px;font-size:14px;color:var(--dark);background:var(--white);outline:none;font-family:'Inter',sans-serif;-webkit-appearance:none}
.fi:focus{border-color:var(--gold)}
.frow{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.fta{width:100%;padding:11px 13px;border:1.5px solid var(--border);border-radius:10px;font-size:14px;color:var(--dark);background:var(--white);outline:none;resize:vertical;font-family:'Inter',sans-serif;min-height:72px}

/* Product card */
.pc{background:var(--white);border:1px solid var(--border);border-radius:14px;padding:14px;margin-bottom:12px;display:flex;gap:12px}
.pi{width:54px;height:54px;border-radius:10px;background:var(--bg);border:1px solid var(--border);display:flex;align-items:center;justify-content:center;font-size:26px;flex-shrink:0}
.pinfo{flex:1;min-width:0}
.pname{font-weight:600;font-size:14px;margin-bottom:2px}
.pdesc{font-size:11px;color:var(--muted);margin-bottom:6px}
.pprices{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:6px}
.pchip{background:var(--bg);border:1px solid var(--border);border-radius:6px;padding:3px 8px;font-size:11px;font-weight:600}
.pbot{display:flex;align-items:center;justify-content:space-between;margin-top:4px}

/* Badge */
.badge{display:inline-flex;padding:3px 9px;border-radius:20px;font-size:11px;font-weight:600}
.b-hit{background:#FFF3CD;color:var(--red)}
.b-active{background:var(--green-p);color:var(--green)}
.b-archive{background:#F0F0F0;color:#888}

/* Purchase card */
.prc{background:var(--white);border:1px solid var(--border);border-radius:12px;padding:14px;margin-bottom:10px}
.prc-h{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:8px}
.prc-name{font-weight:600;font-size:14px}
.prc-meta{font-size:11px;color:var(--muted);margin-top:2px}
.prc-row{display:flex;justify-content:space-between;align-items:center;padding:6px 0;border-bottom:1px solid var(--border);font-size:13px}
.prc-row:last-child{border-bottom:none}
.b-yes{background:var(--green-p);color:var(--green);border-radius:6px;padding:2px 8px;font-size:11px;font-weight:700}
.b-no{background:var(--red-pale);color:var(--red);border-radius:6px;padding:2px 8px;font-size:11px;font-weight:700}
.b-maybe{background:#FFF3CD;color:#E67E22;border-radius:6px;padding:2px 8px;font-size:11px;font-weight:700}

/* Finance */
.fr{display:flex;align-items:center;justify-content:space-between;padding:9px 0;border-bottom:1px solid var(--border)}
.fr:last-child{border-bottom:none}
.fr-label{font-size:13px;color:var(--mid)}
.fr-input{width:115px;padding:7px 9px;border:1.5px solid var(--border);border-radius:8px;font-size:13px;font-weight:600;text-align:right;outline:none;font-family:'Inter',sans-serif}
.fr-input:focus{border-color:var(--gold)}
.ftotal{background:var(--dark);border-radius:12px;padding:14px 18px;display:flex;justify-content:space-between;align-items:center;margin-top:12px}
.ftotal-label{font-size:12px;color:#999}
.ftotal-value{font-family:'Cormorant Garamond',serif;font-size:22px;font-weight:700;color:var(--gold)}
.profit-block{background:var(--dark);border-radius:14px;padding:20px;text-align:center;margin-top:14px}
.profit-label{font-size:11px;color:#888;text-transform:uppercase;letter-spacing:1px;margin-bottom:4px}
.profit-value{font-family:'Cormorant Garamond',serif;font-size:40px;font-weight:700}

/* Month tabs */
.mtabs{display:flex;gap:6px;overflow-x:auto;padding-bottom:4px;margin-bottom:14px;-webkit-overflow-scrolling:touch}
.mtabs::-webkit-scrollbar{display:none}
.mt{flex-shrink:0;padding:7px 13px;border-radius:8px;font-size:12px;font-weight:600;cursor:pointer;border:1.5px solid var(--border);color:var(--mid);background:white}
.mt.active{background:var(--dark);color:white;border-color:var(--dark)}

/* Calc */
.ci{display:flex;align-items:center;gap:8px;padding:8px 0;border-bottom:1px solid var(--border)}
.calc-result{background:var(--dark);border-radius:14px;padding:20px;margin-top:14px}
.cr-label{font-size:11px;color:#888;text-transform:uppercase;letter-spacing:1px;margin-bottom:4px}
.cr-value{font-family:'Cormorant Garamond',serif;font-size:36px;font-weight:700;color:#fff;margin-bottom:16px}
.popts{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.popt{background:#252525;border-radius:10px;padding:13px 8px;text-align:center}
.popt-label{font-size:10px;color:#888;margin-bottom:4px}
.popt-price{font-size:17px;font-weight:700;color:var(--gold)}
.popt-profit{font-size:10px;color:#555;margin-top:3px}

/* AI zone */
.ai-zone{border:2px dashed var(--gold);border-radius:12px;padding:20px;text-align:center;background:var(--gold-l);cursor:pointer;margin-bottom:12px}
.ai-icon{font-size:28px;margin-bottom:6px}

/* Modal */
.modal-backdrop{position:fixed;inset:0;background:rgba(0,0,0,.55);z-index:200;display:flex;flex-direction:column;justify-content:flex-end}
.modal{background:var(--white);border-radius:20px 20px 0 0;padding:20px 20px calc(20px + var(--safe-b));max-height:90vh;overflow-y:auto;-webkit-overflow-scrolling:touch}
.modal-handle{width:40px;height:4px;background:var(--border);border-radius:2px;margin:0 auto 16px}
.modal-title{font-family:'Cormorant Garamond',serif;font-size:22px;font-weight:700;margin-bottom:16px}
.mact{display:flex;gap:10px;margin-top:16px}
.mact .btn{flex:1;justify-content:center}

/* Toast */
.toast{position:fixed;top:20px;left:50%;transform:translateX(-50%);background:var(--dark);color:#fff;padding:10px 20px;border-radius:10px;font-size:13px;font-weight:600;z-index:300;opacity:0;transition:opacity .3s;pointer-events:none}
.toast.show{opacity:1}

/* Empty */
.empty{text-align:center;padding:40px 20px;color:var(--muted)}
.empty-icon{font-size:36px;margin-bottom:10px}

/* Loc chip */
.loc-chip{background:var(--gold-l);border:1px solid var(--gold);border-radius:6px;padding:2px 8px;font-size:11px;font-weight:600;color:#8B6914}

/* Sync desktop */
#sync-d{display:none;padding:14px 24px;font-size:11px;color:#666;border-top:1px solid #2a2a2a;margin-top:auto}

/* Spinner */
@keyframes spin{to{transform:rotate(360deg)}}
.spinner{width:15px;height:15px;border:2px solid rgba(255,255,255,.3);border-top-color:#fff;border-radius:50%;animation:spin .8s linear infinite}

.sec-head{font-size:11px;font-weight:600;color:var(--muted);text-transform:uppercase;letter-spacing:1px;margin:14px 0 8px}
</style>
</head>

function loadLocal() {
  try { var r = localStorage.getItem(SK); if(r) return JSON.parse(r); } catch(e){}
  return null;
}

function validateState(s) {
  if (!s || typeof s !== 'object') return JSON.parse(JSON.stringify(DEFAULT));
  if (!Array.isArray(s.products)) s.products = [];
  if (!Array.isArray(s.purchases)) s.purchases = [];
  if (!Array.isArray(s.finance) || s.finance.length < 12) s.finance = makeFinance();
  if (!Array.isArray(s.calcItems)) s.calcItems = JSON.parse(JSON.stringify(DEFAULT.calcItems));
  if (typeof s.activeMonth !== 'number' || s.activeMonth < 0 || s.activeMonth > 11) s.activeMonth = 7;
  var pages = ['dashboard','catalog','calc','purchases','finance'];
  if (pages.indexOf(s.currentPage) === -1) s.currentPage = 'dashboard';
  // ensure each finance month has all fields
  s.finance = s.finance.map(function(fm, i) {
    var def = DEFAULT.finance[i] || {};
    return Object.assign({}, def, fm || {});
  });
  return s;
}

var S = validateState(loadLocal() || JSON.parse(JSON.stringify(DEFAULT)));

// ── Helpers ───────────────────────────────────────────────────────────────────
function fmt(n) { return n ? Number(n).toLocaleString('ru') + ' грн' : '—'; }
function fmtN(n) { return Number(n||0).toLocaleString('ru'); }
function esc(s) { return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }

function toast(msg) {
  var t = document.getElementById('toast');
  t.textContent = msg; t.classList.add('show');
  setTimeout(function(){ t.classList.remove('show'); }, 2000);
}

function render() {
  var area = document.getElementById('scroll-area');
  if (!area) return;
  var html = '';
  try {
    if (S.currentPage === 'dashboard') html = pageDashboard();
    else if (S.currentPage === 'catalog') html = pageCatalog();
    else if (S.currentPage === 'calc') html = pageCalc();
    else if (S.currentPage === 'purchases') html = pagePurchases();
    else if (S.currentPage === 'finance') html = pageFinance();
    else { S.currentPage = 'dashboard'; html = pageDashboard(); }
  } catch(e) {
    html = '<div style="padding:20px;color:red;font-size:13px"><b>Ошибка рендера:</b> ' + esc(e.message) + '</div>';
    console.error(e);
  }
  area.innerHTML = html;

  // Nav active state
  document.querySelectorAll('.ni').forEach(function(el) {
    el.classList.toggle('active', el.getAttribute('data-page') === S.currentPage);
  });

  // Mobile header button
  var hbtn = document.getElementById('hbtn');
  if (hbtn) {
    if (S.currentPage === 'catalog' || S.currentPage === 'purchases') {
      hbtn.style.display = 'block';
      hbtn.onclick = S.currentPage === 'catalog' ? openProductModal : openPurchaseModal;
    } else {
      hbtn.style.display = 'none';
    }
  }
}

function navigate(page) {
  S.currentPage = page;
  render();
  var area = document.getElementById('scroll-area');
  if (area) area.scrollTop = 0;
}

document.getElementById('bnav').addEventListener('click', function(e) {
  var ni = e.target.closest('.ni');
  if (ni && ni.getAttribute('data-page')) navigate(ni.getAttribute('data-page'));
});

function pageDashboard() {
  var fm = S.finance[S.activeMonth] || {};
  var inc = (fm.incomeIG||0)+(fm.incomeAbout||0)+(fm.incomeOther||0);
  var exp = (fm.expSalary||0)+(fm.expTeam||0)+(fm.expMaterials||0)+(fm.expFurniture||0)+(fm.expPackaging||0)+(fm.expDeliveryIn||0)+(fm.expAds||0)+(fm.expSmm||0)+(fm.expPhoto||0)+(fm.expStudio||0)+(fm.expDeliveryOut||0)+(fm.expOther||0);
  var profit = inc - exp;
  var yInc = S.finance.reduce(function(s,m){ return s+(m.incomeIG||0)+(m.incomeAbout||0)+(m.incomeOther||0); },0);
  var yExp = S.finance.reduce(function(s,m){ return s+(m.expSalary||0)+(m.expTeam||0)+(m.expMaterials||0)+(m.expFurniture||0)+(m.expPackaging||0)+(m.expDeliveryIn||0)+(m.expAds||0)+(m.expSmm||0)+(m.expPhoto||0)+(m.expStudio||0)+(m.expDeliveryOut||0)+(m.expOther||0); },0);
  var hits = S.products.filter(function(p){ return p.status==='Хит'; }).map(function(p){
    return '<div class="fr"><div style="display:flex;align-items:center;gap:10px"><div class="pi" style="width:38px;height:38px;font-size:20px">'+esc(p.img)+'</div><div><div style="font-weight:600;font-size:13px">'+esc(p.name)+'</div><div style="font-size:11px;color:var(--muted)">'+esc(p.material||'')+'</div></div></div><div style="font-weight:700;font-size:13px">'+fmt(p.price1)+'</div></div>';
  }).join('') || '<div style="font-size:13px;color:var(--muted)">Нет хитов</div>';

  return '<div style="padding-top:4px">'
    +'<div style="font-family:\'Cormorant Garamond\',serif;font-size:26px;font-weight:700;margin-bottom:2px">Добро пожаловать 🤍</div>'
    +'<div style="font-size:12px;color:var(--muted);margin-bottom:16px">Miro Jewelry — внутренняя платформа</div>'
    +'<div class="stats-grid">'
    +'<div class="stat"><div class="stat-label">Товаров</div><div class="stat-value">'+S.products.length+'</div><div class="stat-sub">актив: '+S.products.filter(function(p){return p.status!=='Архив';}).length+'</div></div>'
    +'<div class="stat"><div class="stat-label">Доход мес.</div><div class="stat-value" style="color:var(--green)">'+fmtN(inc)+'</div><div class="stat-sub">грн</div></div>'
    +'<div class="stat"><div class="stat-label">Расходы мес.</div><div class="stat-value" style="color:var(--red)">'+fmtN(exp)+'</div><div class="stat-sub">грн</div></div>'
    +'<div class="stat"><div class="stat-label">Прибыль мес.</div><div class="stat-value" style="color:'+(profit>=0?'var(--green)':'var(--red)')+'">'+fmtN(profit)+'</div><div class="stat-sub" style="color:'+(profit>=0?'var(--green)':'var(--red)')+'">'+(profit>=0?'▲ в плюсе':'▼ в минусе')+'</div></div>'
    +'</div>'
    +'<div class="card"><div class="card-title">🔥 Хиты продаж</div>'+hits+'</div>'
    +'<div class="card"><div class="card-title">📅 Итоги года</div>'
    +'<div class="fr"><span class="fr-label">Доход за год</span><span style="font-weight:700;color:var(--green)">'+fmt(yInc)+'</span></div>'
    +'<div class="fr"><span class="fr-label">Расходы за год</span><span style="font-weight:700;color:var(--red)">'+fmt(yExp)+'</span></div>'
    +'<div class="ftotal"><span class="ftotal-label">Прибыль за год</span><span class="ftotal-value" style="color:'+(yInc-yExp>=0?'var(--gold)':'#E74C3C')+'">'+fmtN(yInc-yExp)+' грн</span></div>'
    +'</div></div>';
}

function locStockHtml(ls) {
  if (!ls || !ls.length) return '';
  var rows = ls.map(function(l){ return '<div style="display:flex;justify-content:space-between;padding:3px 0"><span class="loc-chip">📍 '+esc(l.loc)+'</span><span style="font-size:12px;font-weight:600">'+l.qty+' шт</span></div>'; }).join('');
  return '<div style="margin-top:8px;padding-top:8px;border-top:1px solid var(--border)">'+rows+'</div>';
}

function pageCatalog() {
  var cards = S.products.map(function(p) {
    var bc = p.status==='Хит'?'b-hit':p.status==='Архив'?'b-archive':'b-active';
    var bt = p.status==='Хит'?'🔥 Хит':esc(p.status||'');
    var total = (p.locationStock||[]).reduce(function(s,l){return s+l.qty;},0)||0;
    var prices = '<span class="pchip">'+fmt(p.price1)+'</span>'
      +(p.comp2?'<span class="pchip" style="font-size:10px">'+esc(p.comp2)+': '+fmt(p.price2)+'</span>':'')
      +(p.comp3?'<span class="pchip" style="font-size:10px">'+esc(p.comp3)+': '+fmt(p.price3)+'</span>':'');
    return '<div class="pc">'
      +'<div class="pi">'+esc(p.img||'💎')+'</div>'
      +'<div class="pinfo">'
      +'<div style="display:flex;justify-content:space-between;align-items:flex-start">'
      +'<div class="pname">'+esc(p.name)+'</div>'
      +'<div style="display:flex;gap:4px"><button class="btn-x" onclick="editProduct('+p.id+')">✏️</button><button class="btn-x" onclick="delProduct('+p.id+')">🗑️</button></div>'
      +'</div>'
      +'<div class="pdesc">'+esc(p.desc||'')+'</div>'
      +'<div class="pprices">'+prices+'</div>'
      +'<div class="pbot"><span class="badge '+bc+'">'+bt+'</span><span style="font-size:11px;color:var(--muted)">Всего: '+total+' шт</span></div>'

  return '<div>'
    +'<div style="font-family:\'Cormorant Garamond\',serif;font-size:26px;font-weight:700;margin-bottom:2px">Каталог</div>'
    +'<div style="font-size:12px;color:var(--muted);margin-bottom:16px">Украшения, цены и комплекты</div>'
    +'<div class="card" style="border:2px dashed var(--gold);background:var(--gold-l);margin-bottom:14px">'
    +'<div class="card-title" style="color:#8B6914">✨ Добавить через AI</div>'
    +'<div class="ai-zone" onclick="document.getElementById(\'ai-file\').click()">'
    +'<div id="ai-prev-wrap"><div class="ai-icon">📷</div></div>'
    +'<div style="font-size:13px;font-weight:600;margin-bottom:3px">Загрузи фото украшения</div>'
    +'<div style="font-size:11px;color:var(--muted)">AI заполнит карточку автоматически</div>'
    +'</div>'
    +'<input type="file" id="ai-file" accept="image/*" style="display:none" onchange="onAiFile(this)"/>'
    +'<textarea class="fta" id="ai-text" placeholder="Вставь описание, цену, размер…" style="margin-bottom:10px"></textarea>'
    +'<button class="btn btn-gold" id="ai-btn" onclick="doAiFill()">✨ Заполнить через AI</button>'
    +'</div>'
    +'<div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:12px">'

function pageCalc() {

      +'<input class="fi" style="flex:1;padding:7px 9px;font-size:13px" value="'+esc(item.name)+'" oninput="S.calcItems['+i+'].name=this.value;saveNow()" placeholder="Материал"/>'
      +'<input class="fi" type="number" value="'+item.qty+'" oninput="S.calcItems['+i+'].qty=+this.value||0;updateCalcResult()" style="width:55px;padding:7px 8px;font-size:13px" placeholder="Кол"/>'
      +'<input class="fi" type="number" value="'+item.price+'" oninput="S.calcItems['+i+'].price=+this.value||0;updateCalcResult()" style="width:70px;padding:7px 8px;font-size:13px" placeholder="₴"/>'
      +'<button class="btn-x" onclick="S.calcItems.splice('+i+',1);render()" style="color:var(--red)">✕</button>'

    +'<div style="font-family:\'Cormorant Garamond\',serif;font-size:26px;font-weight:700;margin-bottom:2px">Калькулятор</div>'

    +'<input class="fi" id="ni-name" placeholder="Материал" style="flex:2;padding:9px 11px;font-size:13px"/>'
    +'<input class="fi" id="ni-qty" type="number" placeholder="Кол" style="width:58px;padding:9px 8px;font-size:13px"/>'
    +'<input class="fi" id="ni-price" type="number" placeholder="₴" style="width:68px;padding:9px 8px;font-size:13px"/>'
    +'<button class="btn btn-outline btn-sm" onclick="addCalcItem()">+</button>'
    +'</div></div>'
    +'<div class="calc-result" id="calc-result">'
    +'<div class="cr-label">Себестоимость</div>'
    +'<div class="cr-value" id="cr-cost">'+cost.toFixed(0)+' грн</div>'
    +'<div class="popts">'

function pagePurchases() {
  var goodS = [], badS = [];
  S.purchases.forEach(function(p){ if(p.buyMore==='ДА'&&p.supplier&&goodS.indexOf(p.supplier)===-1) goodS.push(p.supplier); if(p.buyMore==='НЕТ'&&p.supplier&&badS.indexOf(p.supplier)===-1) badS.push(p.supplier); });
  var suppHtml = (goodS.length||badS.length) ? '<div class="card" style="margin-bottom:14px"><div class="card-title">📋 Поставщики</div>'
    +(goodS.length?'<div style="font-size:11px;font-weight:600;color:var(--green);text-transform:uppercase;letter-spacing:.5px;margin-bottom:5px">✅ Рекомендую</div>'+goodS.map(function(s){return '<div style="font-size:13px;padding:3px 0">'+esc(s)+'</div>';}).join(''):'')
    +(badS.length?'<div style="font-size:11px;font-weight:600;color:var(--red);text-transform:uppercase;letter-spacing:.5px;margin:8px 0 5px">❌ Не рекомендую</div>'+badS.map(function(s){return '<div style="font-size:13px;padding:3px 0">'+esc(s)+'</div>';}).join(''):'')
    +'</div>' : '';

  var cards = S.purchases.map(function(p){
    var bc = p.buyMore==='ДА'?'b-yes':p.buyMore==='НЕТ'?'b-no':'b-maybe';
    var bt = p.buyMore==='ДА'?'✅ ДА':p.buyMore==='НЕТ'?'❌ НЕТ':'🤔 Попробовать';
    var stars = '⭐'.repeat(p.quality||0);
    var lnk = p.link ? '<a href="'+esc(p.link)+'" target="_blank" style="display:inline-flex;align-items:center;gap:4px;font-size:12px;color:var(--gold);font-weight:600;text-decoration:none;margin-top:8px;padding-top:8px;border-top:1px solid var(--border)">🔗 Ссылка на поставщика</a>' : '';
    return '<div class="prc">'
      +'<div class="prc-h"><div><div class="prc-name">'+esc(p.name)+'</div><div class="prc-meta">'+esc(p.supplier||'—')+' · '+esc(p.date||'—')+'</div></div>'
      +'<button class="btn-x" onclick="delPurchase('+p.id+')" style="color:var(--red)">🗑️</button></div>'
      +'<div class="prc-row"><span style="color:var(--muted)">Сумма</span><span style="font-weight:700">'+fmt(p.amount)+'</span></div>'
      +'<div class="prc-row"><span style="color:var(--muted)">Объём</span><span>'+p.qty+' '+esc(p.unit||'')+'</span></div>'
      +'<div class="prc-row"><span style="color:var(--muted)">Качество</span><span>'+stars+'</span></div>'
      +'<div class="prc-row"><span style="color:var(--muted)">Брать ещё?</span><span class="'+bc+'">'+bt+'</span></div>'
      +(p.comment?'<div style="font-size:12px;color:var(--muted);margin-top:8px;padding-top:8px;border-top:1px solid var(--border)">'+esc(p.comment)+'</div>':'')
      +lnk+'</div>';
  }).join('');

  var total = S.purchases.reduce(function(s,p){return s+(p.amount||0);},0);

  return '<div>'
    +'<div style="font-family:\'Cormorant Garamond\',serif;font-size:26px;font-weight:700;margin-bottom:2px">Закупки</div>'
    +'<div style="font-size:12px;color:var(--muted);margin-bottom:16px">Материалы и контроль качества</div>'
    +suppHtml
    +'<div class="sec-head">Все закупки ('+S.purchases.length+')</div>'
    +(S.purchases.length ? cards : '<div class="empty"><div class="empty-icon">🛒</div><div>Нет закупок</div></div>')
    +(S.purchases.length?'<div class="ftotal" style="margin-top:8px"><span class="ftotal-label">Итого на закупки</span><span class="ftotal-value">'+fmtN(total)+' грн</span></div>':'')
    +'</div>';

function pageFinance() {
  var fm = S.finance[S.activeMonth] || {};
  var inc = (fm.incomeIG||0)+(fm.incomeAbout||0)+(fm.incomeOther||0);
  var exp = (fm.expSalary||0)+(fm.expTeam||0)+(fm.expMaterials||0)+(fm.expFurniture||0)+(fm.expPackaging||0)+(fm.expDeliveryIn||0)+(fm.expAds||0)+(fm.expSmm||0)+(fm.expPhoto||0)+(fm.expStudio||0)+(fm.expDeliveryOut||0)+(fm.expOther||0);
  var profit = inc - exp;

  var tabs = MONTHS.map(function(m,i){
    return '<button class="mt'+(i===S.activeMonth?' active':'')+'" onclick="S.activeMonth='+i+';render()">'+m.slice(0,3)+'</button>';
  }).join('');

  function fi(k,label) {
    return '<div class="fr"><span class="fr-label">'+label+'</span><input class="fr-input" type="number" value="'+(fm[k]||'')+'" oninput="S.finance['+S.activeMonth+'][\''+k+'\']=+this.value||0;scheduleSave()" placeholder="0"/></div>';
  }

  var groups = [
    {label:'👥 Команда / ЗП',color:'#8E44AD',rows:[['expSalary','Зарплата (своя)'],['expTeam','Команда / фрилансеры']]},
    {label:'📦 Производство',color:'#2980B9',rows:[['expMaterials','Материалы'],['expFurniture','Фурнитура'],['expPackaging','Упаковка'],['expDeliveryIn','Доставка материалов']]},
    {label:'📣 Маркетинг',color:'#E67E22',rows:[['expAds','Реклама / трафик'],['expSmm','SMM'],['expPhoto','Фотограф / съёмка'],['expStudio','Аренда студии']]},
    {label:'🚚 Доставка клиентам',color:'#27AE60',rows:[['expDeliveryOut','Доставка клиентам']]},
    {label:'📋 Прочее',color:'#7F8C8D',rows:[['expOther','Прочие расходы']]},
  ];

  var expHtml = groups.map(function(g){
    var gt = g.rows.reduce(function(s,r){return s+(fm[r[0]]||0);},0);
    return '<div style="margin-bottom:12px">'
      +'<div style="display:flex;justify-content:space-between;padding:6px 0;border-bottom:2px solid '+g.color+'33;margin-bottom:2px">'
      +'<span style="font-size:12px;font-weight:700;color:'+g.color+'">'+g.label+'</span>'
      +(gt?'<span style="font-size:12px;font-weight:700;color:'+g.color+'">'+fmtN(gt)+' грн</span>':'')
      +'</div>'
      +g.rows.map(function(r){return fi(r[0],r[1]);}).join('')
      +'</div>';
  }).join('');

  return '<div>'
    +'<div style="font-family:\'Cormorant Garamond\',serif;font-size:26px;font-weight:700;margin-bottom:2px">Финансы</div>'

    +'<div class="mtabs">'+tabs+'</div>'
    +'<div class="card"><div class="card-title">💚 Доходы</div>'
    +fi('incomeIG','Instagram')+fi('incomeAbout','Кафе About')+fi('incomeOther','Другие')
    +'<div class="ftotal"><span class="ftotal-label">Итого доход</span><span class="ftotal-value" style="color:var(--gold)">'+fmtN(inc)+' грн</span></div>'
    +'</div>'
    +'<div class="card"><div class="card-title">🔴 Расходы по статьям</div>'+expHtml
    +'<div class="ftotal"><span class="ftotal-label">Итого расходы</span><span class="ftotal-value" style="color:#E74C3C">'+fmtN(exp)+' грн</span></div>'
    +'</div>'
    +'<div class="profit-block"><div class="profit-label">Чистая прибыль — '+MONTHS[S.activeMonth]+'</div>'
    +'<div class="profit-value" style="color:'+(profit>=0?'var(--gold)':'#E74C3C')+'">'+fmtN(profit)+' грн</div>'
    +'</div></div>';
}

// ── Calc helpers ──────────────────────────────────────────────────────────────
function saveNow() { localStorage.setItem(SK, JSON.stringify(S)); }

function updateCalcResult() {
  var cost = S.calcItems.reduce(function(s,i){return s+i.qty*i.price;},0);
  var c = document.getElementById('cr-cost'); if(c) c.textContent = cost.toFixed(0)+' грн';
  [[3,'po3','pp3'],[4,'po4','pp4'],[5,'po5','pp5']].forEach(function(m){
    var pe = document.getElementById(m[1]), pr = document.getElementById(m[2]);
    if(pe) pe.textContent = (cost*m[0]).toFixed(0)+' ₴';
    if(pr) pr.textContent = 'прибыль '+(cost*(m[0]-1)).toFixed(0)+' ₴';
  });
  saveNow();
}

function addCalcItem() {
  var n = document.getElementById('ni-name').value.trim();
  var q = +document.getElementById('ni-qty').value||1;
  var p = +document.getElementById('ni-price').value||0;
  if (!n) return;
  S.calcItems.push({name:n,qty:q,price:p});
  render();
}

// ── Product actions ───────────────────────────────────────────────────────────
var editId = null;
var locItems = [];
var aiImgData = null;

function openProductModal(data) {
  editId = data.id || null;
  locItems = JSON.parse(JSON.stringify(data.locationStock || []));
  var d = document.createElement('div');
  d.className = 'modal-backdrop';
  d.id = 'pm';
  d.innerHTML = '<div class="modal">'
    +'<div class="modal-handle"></div>'
    +'<div class="modal-title">'+(editId?'Редактировать':'Новый товар')+'</div>'
    +'<div class="fg"><label>Название</label><input class="fi" id="m-name" value="'+esc(data.name||'')+'"/></div>'
    +'<div class="fg"><label>Описание / материал</label><textarea class="fta" id="m-desc">'+esc(data.desc||'')+'</textarea></div>'
    +'<div class="frow"><div class="fg"><label>Материал</label><input class="fi" id="m-mat" value="'+esc(data.material||'')+'"/></div>'
    +'<div class="fg"><label>Иконка</label><input class="fi" id="m-img" value="'+esc(data.img||'💎')+'"/></div></div>'
    +'<div class="frow"><div class="fg"><label>Цена 1 шт (грн)</label><input class="fi" type="number" id="m-p1" value="'+(data.price1||'')+'"/></div>'
    +'<div class="fg"><label>Себестоимость</label><input class="fi" type="number" id="m-cost" value="'+(data.cost||'')+'"/></div></div>'
    +'<div class="frow"><div class="fg"><label>Комплект 2 (состав)</label><input class="fi" id="m-c2" value="'+esc(data.comp2||'')+'" placeholder="Браслет + чокер"/></div>'
    +'<div class="fg"><label>Цена комплект 2</label><input class="fi" type="number" id="m-p2" value="'+(data.price2||'')+'"/></div></div>'
    +'<div class="frow"><div class="fg"><label>Комплект 3 (состав)</label><input class="fi" id="m-c3" value="'+esc(data.comp3||'')+'" placeholder="+ серьги"/></div>'
    +'<div class="fg"><label>Цена комплект 3</label><input class="fi" type="number" id="m-p3" value="'+(data.price3||'')+'"/></div></div>'
    +'<div class="frow"><div class="fg"><label>Остаток (шт)</label><input class="fi" type="number" id="m-stock" value="'+(data.stock||1)+'"/></div>'
    +'<div class="fg"><label>Статус</label><select class="fi" id="m-status"><option'+((!data.status||data.status==='Активный')?' selected':'')+'>Активный</option><option'+(data.status==='Хит'?' selected':'')+'>Хит</option><option'+(data.status==='Архив'?' selected':'')+'>Архив</option></select></div></div>'
    +'<div class="fg"><label>📍 Где выставлено и сколько</label>'
    +'<div id="loc-list" style="display:flex;flex-direction:column;gap:6px;margin-bottom:8px"></div>'
    +'<div style="display:flex;gap:8px;margin-bottom:8px">'
    +'<input class="fi" id="loc-name" placeholder="Кафе About / Магазин…" style="flex:1"/>'
    +'<input class="fi" type="number" id="loc-qty" placeholder="шт" value="1" style="width:58px;text-align:center"/>'
    +'<button class="btn btn-outline btn-sm" onclick="addLoc()">+</button></div>'
    +'<div style="display:flex;flex-wrap:wrap;gap:5px">'+['Кафе About','Instagram','Ярмарка','Магазин','Шоурум'].map(function(s){return '<button onclick="quickLoc(\''+s+'\')" style="background:var(--bg);border:1px solid var(--border);border-radius:6px;padding:3px 8px;font-size:11px;cursor:pointer">'+s+'</button>';}).join('')+'</div></div>'
    +'<div class="mact"><button class="btn btn-outline" onclick="document.getElementById(\'pm\').remove()">Отмена</button><button class="btn btn-red" onclick="saveProduct()">Сохранить</button></div>'
    +'</div>';
  document.body.appendChild(d);
  d.addEventListener('click', function(e){ if(e.target===d) d.remove(); });
  renderLocList();
}

function renderLocList() {
  var el = document.getElementById('loc-list'); if(!el) return;
  el.innerHTML = locItems.map(function(l,i){
    return '<div style="display:flex;align-items:center;gap:8px">'
      +'<span class="loc-chip" style="flex:1;padding:5px 10px">📍 '+esc(l.loc)+'</span>'
      +'<input type="number" value="'+l.qty+'" onchange="locItems['+i+'].qty=+this.value||0" style="width:58px;padding:6px 8px;border:1.5px solid var(--border);border-radius:8px;font-size:13px;text-align:center;outline:none"/>'
      +'<span style="font-size:11px;color:var(--muted)">шт</span>'
      +'<button class="btn-x" onclick="locItems.splice('+i+',1);renderLocList()" style="color:var(--red)">×</button>'
      +'</div>';
  }).join('');
}

function addLoc() {
  var n = document.getElementById('loc-name').value.trim();
  var q = +document.getElementById('loc-qty').value||1;
  if (!n || locItems.find(function(l){return l.loc===n;})) return;
  locItems.push({loc:n,qty:q});
  document.getElementById('loc-name').value='';
  document.getElementById('loc-qty').value='1';
  renderLocList();
}

function quickLoc(v) {
  if (!locItems.find(function(l){return l.loc===v;})) { locItems.push({loc:v,qty:1}); renderLocList(); }
}

function saveProduct() {
  var p = {
    name: document.getElementById('m-name').value.trim(),
    desc: document.getElementById('m-desc').value.trim(),
    material: document.getElementById('m-mat').value.trim(),
    img: document.getElementById('m-img').value.trim()||'💎',
    price1: +document.getElementById('m-p1').value||0,
    cost: +document.getElementById('m-cost').value||0,
    comp2: document.getElementById('m-c2').value.trim(),
    price2: +document.getElementById('m-p2').value||0,
    comp3: document.getElementById('m-c3').value.trim(),
    price3: +document.getElementById('m-p3').value||0,
    stock: +document.getElementById('m-stock').value||1,
    status: document.getElementById('m-status').value,
    locationStock: JSON.parse(JSON.stringify(locItems)),
  };
  if (!p.name) { alert('Введи название'); return; }
  if (editId) {
    S.products = S.products.map(function(pr){ return pr.id===editId ? Object.assign({},pr,p) : pr; });
  } else {
    p.id = Date.now();
    S.products.push(p);
  }
  var pm = document.getElementById('pm'); if(pm) pm.remove();
  scheduleSave(); render();
  toast(editId?'Товар обновлён ✓':'Товар добавлен ✓');
}

function editProduct(id) {
  var p = S.products.find(function(p){return p.id===id;});
  if (p) openProductModal(p);
}

function delProduct(id) {
  if (confirm('Удалить товар?')) {
    S.products = S.products.filter(function(p){return p.id!==id;});
    scheduleSave(); render(); toast('Товар удалён');
  }
}

    +'<div class="frow"><div class="fg"><label>Поставщик</label><input class="fi" id="pp-sup"/></div>'
    +'<div class="fg"><label>Дата</label><input class="fi" id="pp-date" placeholder="дд.мм.гггг"/></div></div>'
    +'<div class="frow"><div class="fg"><label>Сумма (грн)</label><input class="fi" type="number" id="pp-amt"/></div>'
    +'<div class="fg"><label>Кол-во</label><input class="fi" type="number" id="pp-qty"/></div></div>'
    +'<div class="frow"><div class="fg"><label>Единица</label><select class="fi" id="pp-unit"><option>шт</option><option>м</option><option>г</option><option>кг</option></select></div>'
    +'<div class="fg"><label>Качество (1-5)</label><select class="fi" id="pp-q">'+[1,2,3,4,5].map(function(n){return '<option value="'+n+'"'+(n===5?' selected':'')+'>'+n+' '+'⭐'.repeat(n)+'</option>';}).join('')+'</select></div></div>'
    +'<div class="fg"><label>Брать ещё?</label><select class="fi" id="pp-bm"><option>ДА</option><option>НЕТ</option><option>ПОПРОБОВАТЬ</option></select></div>'
    +'<div class="fg"><label>Комментарий о качестве</label><textarea class="fta" id="pp-comment"></textarea></div>'
    +'<div class="fg"><label>🔗 Ссылка на поставщика</label><input class="fi" id="pp-link" placeholder="https://..."/></div>'
    +'<div class="mact"><button class="btn btn-outline" onclick="document.getElementById(\'ppm\').remove()">Отмена</button><button class="btn btn-red" onclick="savePurchase()">Сохранить</button></div>'
    +'</div>';
  document.body.appendChild(d);
  d.addEventListener('click', function(e){ if(e.target===d) d.remove(); });
}

function savePurchase() {
  var p = {
    id: Date.now(),
    name: document.getElementById('pp-name').value.trim(),
    supplier: document.getElementById('pp-sup').value.trim(),
    date: document.getElementById('pp-date').value.trim(),
    amount: +document.getElementById('pp-amt').value||0,
    qty: +document.getElementById('pp-qty').value||0,
    unit: document.getElementById('pp-unit').value,
    quality: +document.getElementById('pp-q').value,
    buyMore: document.getElementById('pp-bm').value,
    comment: document.getElementById('pp-comment').value.trim(),
    link: document.getElementById('pp-link').value.trim(),
  };
  if (!p.name) { alert('Введи название материала'); return; }
  S.purchases.push(p);
  var ppm = document.getElementById('ppm'); if(ppm) ppm.remove();
  scheduleSave(); render(); toast('Закупка добавлена ✓');
}

function delPurchase(id) {
  if (confirm('Удалить закупку?')) {
    S.purchases = S.purchases.filter(function(p){return p.id!==id;});
    scheduleSave(); render(); toast('Закупка удалена');
  }
}

// ── AI fill ───────────────────────────────────────────────────────────────────
function onAiFile(input) {
  var file = input.files[0]; if(!file) return;
  var reader = new FileReader();
  reader.onload = function(e) {
    aiImgData = {data: e.target.result.split(',')[1], type: file.type};
    var w = document.getElementById('ai-prev-wrap');
    if(w) w.innerHTML = '<img src="'+e.target.result+'" style="width:80px;height:80px;object-fit:cover;border-radius:10px;margin-bottom:6px"/>';
  };
  reader.readAsDataURL(file);
}

async function doAiFill() {
  var text = (document.getElementById('ai-text')||{}).value||'';
  if (!text && !aiImgData) { alert('Добавь фото или описание'); return; }
  var btn = document.getElementById('ai-btn');
  if(btn){ btn.innerHTML='<div class="spinner"></div> AI заполняет…'; btn.disabled=true; }
  try {
    var content = [];
    if(aiImgData) content.push({type:'image',source:{type:'base64',media_type:aiImgData.type,data:aiImgData.data}});
    content.push({type:'text',text:'Заполни карточку украшения Miro Jewelry. Верни ТОЛЬКО JSON без markdown:\n{"name":"","desc":"","material":"","price1":0,"comp2":"","price2":0,"comp3":"","price3":0,"stock":1,"status":"Активный","cost":0,"img":"💎"}\n\nИнформация: '+(text||'смотри на фото')});
    var res = await fetch('https://api.anthropic.com/v1/messages',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({model:'claude-sonnet-4-6',max_tokens:1000,messages:[{role:'user',content:content}]})});
    var data = await res.json();
    var raw = (data.content||[]).filter(function(b){return b.type==='text';})[0];
    if(raw){ var parsed = JSON.parse(raw.text.replace(/```json?|```/g,'').trim()); openProductModal(parsed); toast('AI заполнил карточку ✓'); }
  } catch(e) { alert('Ошибка AI: '+e.message); }
  if(btn){ btn.innerHTML='✨ Заполнить через AI'; btn.disabled=false; }
}

// ── Init ──────────────────────────────────────────────────────────────────────
render();
initSB().then(function(){ return loadCloud(); }).then(function(cloud){
  if (cloud) {
    var validated = validateState(cloud);
    // Only use cloud data if it has valid products array
    if (Array.isArray(validated.products)) {
      S = validated;
      localStorage.setItem(SK, JSON.stringify(S));
      render();
    }
  }
}).catch(function(e){ console.warn('Cloud init error', e); });
</script>
