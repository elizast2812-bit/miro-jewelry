*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
:root{--red:#C0392B;--red-p:#FDF1F0;--gold:#C9A96E;--gold-l:#F5EDD8;--dark:#1A1A1A;--mid:#4A4A4A;--muted:#8A8A8A;--border:#E8E0D8;--bg:#FAF8F5;--white:#FFF;--green:#27AE60;--green-p:#EAF7EE;--sb:env(safe-area-inset-bottom,0px)}
html,body{min-height:100vh;background:var(--bg);font-family:'Inter',sans-serif;color:var(--dark)}
#app{display:flex;flex-direction:column;min-height:100vh}
.hdr{background:var(--dark);padding:14px 18px;display:flex;align-items:center;justify-content:space-between;flex-shrink:0}
.logo{font-family:'Cormorant Garamond',serif;font-size:22px;font-weight:700;color:#fff;letter-spacing:1px}
.logo-s{font-size:9px;color:var(--gold);letter-spacing:3px;text-transform:uppercase;margin-top:1px}
#sync{font-size:10px;color:#888}
.scroll{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;padding:16px 16px calc(72px + var(--sb))}
.bnav{position:fixed;bottom:0;left:0;right:0;background:var(--dark);display:flex;padding:6px 0 calc(6px + var(--sb));z-index:50;border-top:1px solid #2a2a2a;overflow-x:auto}
.ni{flex:0 0 auto;min-width:60px;display:flex;flex-direction:column;align-items:center;gap:3px;cursor:pointer;padding:3px 8px}
.ni span:first-child{font-size:18px;line-height:1}
.ni span:last-child{font-size:9px;color:#666;font-weight:500;white-space:nowrap}
.ni.active span:last-child{color:var(--gold)}
@media(min-width:768px){
  #app{flex-direction:row}
  .hdr{display:none}
  .bnav{position:fixed;left:0;top:0;bottom:0;width:200px;flex-direction:column;padding:0;border-top:none;border-right:1px solid #2a2a2a;justify-content:flex-start;overflow-x:hidden;overflow-y:auto}
  .bnav::before{content:'miro';font-family:'Cormorant Garamond',serif;font-size:22px;font-weight:700;color:#fff;letter-spacing:1px;padding:24px 22px 2px;display:block}
  .bnav::after{content:'JEWELRY PLATFORM';font-size:9px;color:var(--gold);letter-spacing:3px;padding:0 22px 16px;display:block;border-bottom:1px solid #2a2a2a;margin-bottom:6px}
  .ni{flex:none;flex-direction:row;padding:12px 22px;gap:10px;justify-content:flex-start;border-left:3px solid transparent;min-width:auto}
  .ni.active{background:#252525;border-left-color:var(--gold)}
  .ni span:first-child{font-size:16px}
  .ni span:last-child{font-size:13px;color:#888}
  .ni.active span:last-child{color:#fff}
  .scroll{margin-left:200px;padding:26px 30px 40px}
  .stats-grid{grid-template-columns:repeat(4,1fr)!important}
  .modal-backdrop{align-items:center}
  .modal{border-radius:16px;max-width:600px;margin:auto}
}

.ctitle{font-size:11px;font-weight:600;color:var(--muted);letter-spacing:1px;text-transform:uppercase;margin-bottom:12px}
.stats-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:14px}
.stat{background:var(--white);border:1px solid var(--border);border-radius:14px;padding:14px;cursor:pointer}
.slabel{font-size:10px;color:var(--muted);text-transform:uppercase;letter-spacing:.5px;margin-bottom:6px}
.sval{font-family:'Cormorant Garamond',serif;font-size:24px;font-weight:700}
.ssub{font-size:10px;color:var(--green);margin-top:2px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;padding:10px 18px;border-radius:10px;font-size:13px;font-weight:600;cursor:pointer;border:none;font-family:'Inter',sans-serif;width:100%}
.btn-red{background:var(--red);color:#fff}
.btn-gold{background:var(--gold);color:#fff}
.btn-out{background:transparent;border:1.5px solid var(--border);color:var(--mid)}
.btn-sm{padding:6px 13px;font-size:12px;width:auto}
.bx{background:transparent;border:none;font-size:18px;cursor:pointer;color:var(--muted);padding:4px;line-height:1}
.fg{margin-bottom:13px}

.fi{width:100%;padding:11px 13px;border:1.5px solid var(--border);border-radius:10px;font-size:14px;color:var(--dark);background:var(--white);outline:none;font-family:'Inter',sans-serif;-webkit-appearance:none}

.frow{display:grid;grid-template-columns:1fr 1fr;gap:10px}

.pdesc{font-size:11px;color:var(--muted);margin-bottom:6px}
.pprices{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:6px}
.pchip{background:var(--bg);border:1px solid var(--border);border-radius:6px;padding:3px 8px;font-size:11px;font-weight:600}
.badge{display:inline-flex;padding:3px 9px;border-radius:20px;font-size:11px;font-weight:600}

.lchip{background:var(--gold-l);border:1px solid var(--gold);border-radius:6px;padding:2px 8px;font-size:11px;font-weight:600;color:#8B6914}
.prc{background:var(--white);border:1px solid var(--border);border-radius:12px;padding:14px;margin-bottom:10px}
.prc-h{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:8px}

.prc-row{display:flex;justify-content:space-between;align-items:center;padding:7px 0;border-bottom:1px solid var(--border);font-size:13px}

.b-yes{background:var(--green-p);color:var(--green);border-radius:6px;padding:2px 8px;font-size:11px;font-weight:700}
.b-no{background:var(--red-p);color:var(--red);border-radius:6px;padding:2px 8px;font-size:11px;font-weight:700}

.ftl{font-size:12px;color:#999}
.ftv{font-family:'Cormorant Garamond',serif;font-size:22px;font-weight:700;color:var(--gold)}
.pb{background:var(--dark);border-radius:14px;padding:20px;text-align:center;margin-top:14px}
.pbl{font-size:11px;color:#888;text-transform:uppercase;letter-spacing:1px;margin-bottom:4px}

.crl{font-size:11px;color:#888;text-transform:uppercase;letter-spacing:1px;margin-bottom:4px}
.crv{font-family:'Cormorant Garamond',serif;font-size:36px;font-weight:700;color:#fff;margin-bottom:16px}

.pol{font-size:10px;color:#888;margin-bottom:4px}

.mhandle{width:40px;height:4px;background:var(--border);border-radius:2px;margin:0 auto 16px}
.mtitle{font-family:'Cormorant Garamond',serif;font-size:22px;font-weight:700;margin-bottom:16px}
.mact{display:flex;gap:10px;margin-top:16px}

.empty{text-align:center;padding:40px 20px;color:var(--muted)}
.shead{font-size:11px;font-weight:600;color:var(--muted);text-transform:uppercase;letter-spacing:1px;margin:14px 0 8px}

.spin{width:15px;height:15px;border:2px solid rgba(255,255,255,.3);border-top-color:#fff;border-radius:50%;animation:spin .8s linear infinite;display:inline-block}

var YEARS=[2026,2027,2028,2029,2030];

function dateToISO(d){
  // Converts dd.mm.yyyy to yyyy-mm-dd
  if(!d)return '';
  var p=d.split('.');
  if(p.length===3)return p[2]+'-'+p[1].padStart(2,'0')+'-'+p[0].padStart(2,'0');
  return d; // already ISO or unknown
}

function inCustomRange(dateStr,from,to){
  if(!from||!to)return true;
  var iso=dateToISO(dateStr);
  return iso>=from&&iso<=to;
}
function getFinance(year){
  var key=String(year||S.year);
  if(!S.financeByYear)S.financeByYear={};

  return S.financeByYear[key];
}

  }).join('');
}

}

  if(!s.finMode)s.finMode='month';

  if(!s.finTo)s.finTo='';

  if(!s.purchMode)s.purchMode='month';

  if(typeof s.month!=='number'||s.month<0||s.month>11)s.month=7;

function render(){
  var area=document.getElementById('area');
  if(!area)return;
  var html='';
  try{
    if(S.page==='dashboard')html=pgDash();
    else if(S.page==='catalog')html=pgCatalog();
    else if(S.page==='sales')html=pgSales();
    else if(S.page==='calc')html=pgCalc();
    else if(S.page==='purchases')html=pgPurchases();
    else if(S.page==='finance')html=pgFinance();
    else if(S.page==='marketing')html=pgMarketing();
    else if(S.page==='scripts')html=pgScripts();
    else{S.page='dashboard';html=pgDash();}
  }catch(e){
    html='<div style="padding:20px;color:red;font-size:13px"><b>Помилка:</b> '+esc(e.message)+'</div>';
    console.error(e);
  }
  area.innerHTML=html;
  // Purchases event delegation
  if(S.page==='purchases'){
    var addPBtn=document.getElementById('add-purch-btn');
    if(addPBtn)addPBtn.addEventListener('click',openPurchaseModal);

    var purchSupF=document.getElementById('purch-sup-filter');

    var purchApply=document.getElementById('purch-apply');

    var purchArea=document.getElementById('area');

      purchArea.addEventListener('click',function(e){
        var purchM=e.target.closest('[data-purchmode]');
        if(purchM){S.purchMode=purchM.getAttribute('data-purchmode');render();return;}
        var py=e.target.closest('[data-pyear]');
        if(py){S.purchYear=+py.getAttribute('data-pyear');render();return;}
        var pm=e.target.closest('[data-pmonth]');
        if(pm){S.pmonth=+pm.getAttribute('data-pmonth');render();return;}
        var dp=e.target.closest('[data-delpurch]');
        if(dp&&confirm('Видалити закупку?')){
          var pid=+dp.getAttribute('data-delpurch');
          // Reverse expense
          var x=S.purchases.find(function(p){return p.id===pid;});
          if(x){var dFin=getFinance(x.year||2026);if(dFin&&dFin[x.monthIdx])dFin[x.monthIdx].expMaterials=Math.max(0,(dFin[x.monthIdx].expMaterials||0)-x.amount);}
          S.purchases=S.purchases.filter(function(p){return p.id!==pid;});
          scheduleSave();render();toast('Закупку видалено');return;}
      });
    }
  }
  // Dashboard delegation
  if(S.page==='dashboard'){
    var dArea=document.getElementById('area');
    if(dArea){
      dArea.addEventListener('click',function(e){
        var dm=e.target.closest('[data-dashmode]');
        if(dm){S.dashMode=dm.getAttribute('data-dashmode');render();return;}
        var dy=e.target.closest('[data-dashyear]');

        var dmn=e.target.closest('[data-dashmonth]');

      });
      // Apply button for custom period
      var applyBtn=document.getElementById('dash-apply');
      if(applyBtn){
        applyBtn.addEventListener('click',function(){
          var f=document.getElementById('dash-from');
          var t=document.getElementById('dash-to');
          if(f&&t){
            S.dashFrom=f.value;
            S.dashTo=t.value;
            render();
          }
        });
      }
    }
  }
  // Re-bind dynamic buttons (non-delegated)
  bindDynamicButtons();

// ── Catalog ───────────────────────────────────────────────────────────────────
function applyProductFilters(products){
  var f=S.catalogFilters||{};
  return products.filter(function(p){
    // Search
    if(f.search){
      var q=f.search.toLowerCase();
      var inName=(p.name||'').toLowerCase().includes(q);
      var inMat=(p.material||'').toLowerCase().includes(q);
      var inDesc=(p.desc||'').toLowerCase().includes(q);
      if(!inName&&!inMat&&!inDesc)return false;
    }
    // Category
    if(f.category&&f.category!=='all'){
      if(detectCategory(p.name)!==f.category)return false;
    }
    // Fittings
    if(f.fittings&&f.fittings!==''){
      if((p.fittings||'')!==f.fittings)return false;
    }
    // Fittings color
    if(f.fittingsColor&&f.fittingsColor!==''){
      if((p.fittingsColor||'')!==f.fittingsColor)return false;
    }
    // Location
    if(f.location&&f.location!==''){
      var hasLoc=(p.locationStock||[]).some(function(l){return l.loc===f.location&&l.qty>0;});
      if(!hasLoc)return false;
    }
    // Status
    if(f.status&&f.status!==''){
      if((p.status||'Активний')!==f.status)return false;
    }
    return true;
  });

function pgDash(){
  if(!S.dashMode)S.dashMode='month';
  if(typeof S.dashYear!=='number')S.dashYear=new Date().getFullYear();
  if(typeof S.dashMonth!=='number')S.dashMonth=new Date().getMonth();
  if(!S.dashFrom)S.dashFrom='';
  if(!S.dashTo)S.dashTo='';

  function salesInPeriod(){
    return S.sales.filter(function(s){
      if(S.dashMode==='month')return s.monthIdx===S.dashMonth&&(s.year||2026)===S.dashYear;
      if(S.dashMode==='year')return (s.year||2026)===S.dashYear;
      if(S.dashMode==='custom')return inCustomRange(s.date,S.dashFrom,S.dashTo);
      return true;
    });
  }
  function finInPeriod(){
    var result=[];
    if(S.dashMode==='month'){result=[getFinance(S.dashYear)[S.dashMonth]||{}];}
    else if(S.dashMode==='year'){result=getFinance(S.dashYear);}
    else if(S.dashMode==='custom'&&S.dashFrom&&S.dashTo){
      YEARS.forEach(function(y){var yf=getFinance(y);MO.forEach(function(mn,mi){var ms=y+'-'+String(mi+1).padStart(2,'0')+'-01';var me=y+'-'+String(mi+1).padStart(2,'0')+'-31';if(ms<=S.dashTo&&me>=S.dashFrom)result.push(yf[mi]||{});});});
    }else{result=[getFinance(S.dashYear)[S.dashMonth]||{}];}
    return result.filter(Boolean);
  }

  var fSales=salesInPeriod();
  var finMonths=finInPeriod();
  var totalRevenue=fSales.reduce(function(s,x){return s+(x.amount||0);},0);
  var totalSalesCount=fSales.length;
  var avgCheck=totalSalesCount>0?Math.round(totalRevenue/totalSalesCount):0;
  var totalMargin=fSales.reduce(function(s,x){return s+(x.margin!=null?x.margin:0);},0);
  var marginPct=totalRevenue>0?Math.round(totalMargin/totalRevenue*100):0;
  var totalIncome=finMonths.reduce(function(s,m){return s+(m.incomeIG||0)+(m.incomeAbout||0)+(m.incomeOther||0);},0);
  var totalExpenses=finMonths.reduce(function(s,m){return s+(m.expSalary||0)+(m.expTeam||0)+(m.expMaterials||0)+(m.expFurniture||0)+(m.expPackaging||0)+(m.expDeliveryIn||0)+(m.expAds||0)+(m.expSmm||0)+(m.expPhoto||0)+(m.expStudio||0)+(m.expDeliveryOut||0)+(m.expOther||0);},0);
  var netProfit=totalIncome-totalExpenses;
  var profitability=totalIncome>0?Math.round(netProfit/totalIncome*100):0;
  var activeProducts=S.products.filter(function(p){return p.status!=='Архів';}).length;

  var periodLabel=S.dashMode==='month'?MO[S.dashMonth]+' '+S.dashYear:S.dashMode==='year'?S.dashYear+' рік':(S.dashFrom&&S.dashTo?S.dashFrom+' — '+S.dashTo:'Обраний період');

  var modeBar=['month','year','custom'].map(function(m){var labels={month:'Місяць',year:'Рік',custom:'Свій період'};var act=S.dashMode===m;return '<button data-dashmode="'+m+'" style="padding:6px 14px;border-radius:8px;font-size:12px;font-weight:600;cursor:pointer;border:1.5px solid '+(act?'var(--dark)':'var(--border)')+';background:'+(act?'var(--dark)':'white')+';color:'+(act?'#fff':'var(--mid)')+'">'+labels[m]+'</button>';}).join('');
  var yearSelector=YEARS.map(function(y){var act=y===S.dashYear;return '<button data-dashyear="'+y+'" style="padding:5px 12px;border-radius:8px;font-size:12px;font-weight:600;cursor:pointer;border:1.5px solid '+(act?'var(--dark)':'var(--border)')+';background:'+(act?'var(--dark)':'white')+';color:'+(act?'#fff':'var(--mid)')+'">'+y+'</button>';}).join('');
  var monthSelector=S.dashMode==='month'?'<div class="mtabs" style="margin-top:8px">'+MO.map(function(m,i){return '<button data-dashmonth="'+i+'" class="mt'+(i===S.dashMonth?' active':'')+'">'+m.slice(0,3)+'</button>';}).join('')+'</div>':'';
  var customPicker=S.dashMode==='custom'?'<div style="margin-top:10px"><div style="display:flex;gap:10px;align-items:center;margin-bottom:8px"><input type="date" id="dash-from" value="'+S.dashFrom+'" class="fi" style="flex:1;padding:8px 10px;font-size:13px"/><span style="color:var(--muted)">—</span><input type="date" id="dash-to" value="'+S.dashTo+'" class="fi" style="flex:1;padding:8px 10px;font-size:13px"/></div><button id="dash-apply" style="width:100%;padding:10px;background:var(--dark);color:#fff;border:none;border-radius:10px;font-size:13px;font-weight:600;cursor:pointer">🔍 Застосувати</button></div>':'';

  var incomeBreakdown='<div class="fr"><span class="frl">Instagram</span><span style="font-weight:600">'+fmt(finMonths.reduce(function(s,m){return s+(m.incomeIG||0);},0))+'</span></div>'+'<div class="fr"><span class="frl">Кафе About</span><span style="font-weight:600">'+fmt(finMonths.reduce(function(s,m){return s+(m.incomeAbout||0);},0))+'</span></div>'+'<div class="fr"><span class="frl">Інше</span><span style="font-weight:600">'+fmt(finMonths.reduce(function(s,m){return s+(m.incomeOther||0);},0))+'</span></div>';
  var expKeys=[['expSalary','Зарплата'],['expTeam','Команда'],['expMaterials','Матеріали'],['expFurniture','Фурнітура'],['expPackaging','Пакування'],['expDeliveryIn','Доставка мат.'],['expAds','Реклама'],['expSmm','SMM'],['expPhoto','Фотограф'],['expStudio','Студія'],['expDeliveryOut','Доставка кл.'],['expOther','Інше']];
  var expBreakdown=expKeys.map(function(e){var val=finMonths.reduce(function(s,m){return s+(m[e[0]]||0);},0);return val>0?'<div class="fr"><span class="frl">'+e[1]+'</span><span style="font-weight:600">'+fmt(val)+'</span></div>':'';}).filter(Boolean).join('');

  function mcard(icon,label,value,sub,expandId,expandHtml){
    var hasExp=expandId&&expandHtml;
    return '<div class="stat" style="cursor:'+(hasExp?'pointer':'default')+'" '+(hasExp?'onclick="toggleExpand(\''+expandId+'\')"':'')+'>'+
      '<div class="slabel">'+icon+' '+label+(hasExp?' <span style="font-size:10px">▼</span>':'')+'</div>'+
      '<div class="sval" style="font-size:22px">'+value+'</div>'+
      (sub?'<div class="ssub">'+sub+'</div>':'')+
      (hasExp?'<div id="'+expandId+'" style="display:none;margin-top:10px;padding-top:10px;border-top:1px solid var(--border);text-align:left">'+expandHtml+'</div>':'')+
      '</div>';
  }

  return '<div>'
    +'<div style="font-family:\'Cormorant Garamond\',serif;font-size:26px;font-weight:700;margin-bottom:4px">Дашборд</div>'
    +'<div style="font-size:12px;color:var(--muted);margin-bottom:14px">'+periodLabel+'</div>'
    +'<div style="display:flex;gap:6px;margin-bottom:8px">'+modeBar+'</div>'
    +'<div style="display:flex;gap:6px;flex-wrap:wrap;margin-bottom:4px">'+yearSelector+'</div>'
    +monthSelector+customPicker
    +'<div style="height:14px"></div>'
    +'<div class="stats-grid" style="grid-template-columns:1fr 1fr;margin-bottom:10px">'
    +mcard('💎','Товарів',activeProducts,'актив: '+S.products.length,'','')
    +mcard('🛍️','Продажів',totalSalesCount,totalSalesCount>0?'на '+fmt(totalRevenue):'','','')
    +'</div>'
    +'<div class="stats-grid" style="grid-template-columns:1fr 1fr;margin-bottom:10px">'
    +mcard('💚','Дохід',fmtN(totalIncome)+' грн','','exp-income',incomeBreakdown)
    +mcard('🔴','Витрати',fmtN(totalExpenses)+' грн','','exp-exp',expBreakdown)
    +'</div>'
    +'<div class="stats-grid" style="grid-template-columns:1fr 1fr;margin-bottom:10px">'
    +mcard('📊','Чистий прибуток',fmtN(netProfit)+' грн',(netProfit>=0?'▲ плюс':'▼ мінус'),'','')
    +mcard('📈','Рентабельність',profitability+'%','прибуток/дохід','','')
    +'</div>'
    +'<div class="stats-grid" style="grid-template-columns:1fr 1fr;margin-bottom:10px">'
    +mcard('🧾','Середній чек',avgCheck?fmt(avgCheck):'—','за продаж','','')
    +mcard('💹','Маржинальність',marginPct+'%','маржа/виручка','exp-margin',fSales.filter(function(x){return x.margin!=null;}).slice(-5).reverse().map(function(x){return '<div class="fr"><span style="font-size:12px;max-width:120px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">'+esc(x.productName)+'</span><span style="font-size:12px;font-weight:600;color:'+(x.margin>=0?'var(--green)':'var(--red)')+'">'+Math.round(x.margin/(x.amount||1)*100)+'%</span></div>';}).join('')||'<div style="font-size:12px;color:var(--muted)">Немає даних</div>')
    +'</div>'
    +'</div>';
}

    +(allColors.length?'<select class="fi" id="cat-color" style="font-size:12px;padding:8px 10px"><option value="">Будь-який колір</option>'+allColors.map(function(v){return '<option value="'+esc(v)+'"'+(f.fittingsColor===v?' selected':'')+'>'+esc(v)+'</option>';}).join('')+'</select>':'<div></div>')
    +(allLocations.length?'<select class="fi" id="cat-loc" style="font-size:12px;padding:8px 10px" style="grid-column:1/-1"><option value="">Всі точки</option>'+allLocations.map(function(v){return '<option value="'+esc(v)+'"'+(f.location===v?' selected':'')+'>'+esc(v)+'</option>';}).join('')+'</select>':'')

    var bc=displayStatus==='Хіт'||displayStatus==='Хит'?'b-hit':displayStatus==='Архів'||displayStatus==='Архив'||displayStatus==='Немає'?'b-archive':'b-active';
    var bt=displayStatus==='Хіт'||displayStatus==='Хит'?'🔥 Хіт':displayStatus==='Немає'?'❌ Немає':esc(displayStatus||'Активний');

    // Sell button - uses location price if available

      +(p.fittings?'<div class="prc-row"><span style="color:var(--muted)">Фурнітура</span><span style="font-weight:600">'+esc(p.fittings)+(p.fittingsColor?' · '+esc(p.fittingsColor):'')+'</span></div>':'')
      +(p.size?'<div class="prc-row"><span style="color:var(--muted)">Довжина</span><span style="font-weight:600">'+esc(p.size)+'</span></div>':'')
      +(p.cost?'<div class="prc-row"><span style="color:var(--muted)">Собівартість</span><span style="font-weight:600">'+fmt(p.cost)+'</span></div>':'')
      +(p.desc?'<div style="font-size:12px;color:var(--muted);margin:8px 0">'+esc(p.desc)+'</div>':'')

      +'<div class="prc-row"><span style="color:var(--muted)">Instagram (базова)</span><span style="font-weight:700;color:var(--dark)">'+fmt(p.price1)+'</span></div>'
      +((p.locationPrices||[]).map(function(lp,li){
        return '<div class="prc-row"><span style="color:var(--muted)">'+esc(lp.loc)+'</span>'

      +'</div>'
      +'</div>'
      // Stats: how many sold
      +(function(){
        var sold=S.sales.filter(function(s){return s.productId===p.id;});
        var soldTotal=sold.reduce(function(s,x){return s+x.amount;},0);
        if(!sold.length)return '';
        return '<div style="margin-top:10px;padding-top:10px;border-top:1px solid var(--border)">'

    +'<div style="font-size:13px;font-weight:600;margin-bottom:3px">Завантаж фото прикраси</div>'
    +'<div style="font-size:11px;color:var(--muted)">AI заповнить картку автоматично</div>'
    +'</div>'
    +'<input type="file" id="ai-file" accept="image/*" style="display:none" onchange="onAiFile(this)"/>'

    +'</div>';

function pgSales(){
  var total=S.sales.reduce(function(s,x){return s+(x.amount||0);},0);
  var mSales=S.sales.filter(function(x){return x.monthIdx===S.month&&(x.year||2026)===new Date().getFullYear();});
  var mTotal=mSales.reduce(function(s,x){return s+(x.amount||0);},0);
  var totalMargin=S.sales.reduce(function(s,x){return s+(x.margin!=null?x.margin:0);},0);
  var avgPct=total>0?Math.round(totalMargin/total*100):0;

  var rows=S.sales.slice().reverse().map(function(x,i){
    var realIdx=S.sales.length-1-i;
    // Find product for photo
    var prod=S.products.find(function(pr){return pr.id===x.productId;});
    var photoEl=prod&&prod.photo
      ?'<img src="'+prod.photo+'" style="width:52px;height:52px;object-fit:cover;border-radius:10px;flex-shrink:0"/>'
      :'<div style="width:52px;height:52px;background:var(--bg);border:1px solid var(--border);border-radius:10px;display:flex;align-items:center;justify-content:center;font-size:24px;flex-shrink:0">'+(prod?esc(prod.img||'💎'):'💎')+'</div>';

    // Product meta
    var meta='';
    if(prod){
      if(prod.material)meta+=esc(prod.material);
      if(prod.fittings)meta+=(meta?' · ':'')+esc(prod.fittings);
      if(prod.fittingsColor)meta+=(meta?' · ':'')+esc(prod.fittingsColor);
      if(prod.size)meta+=(meta?' · ':'')+'📏 '+esc(prod.size);
    }

    var marginColor=x.margin!=null?(x.margin>=0?'var(--green)':'var(--red)'):'var(--muted)';
    var marginText=x.margin!=null?(x.amount>0?Math.round(x.margin/x.amount*100)+'%':'—'):'—';

    return '<div style="background:var(--white);border:1px solid var(--border);border-radius:14px;padding:14px;margin-bottom:10px">'
      // Header: photo + name + delete
      +'<div style="display:flex;gap:12px;align-items:flex-start">'
      +photoEl
      +'<div style="flex:1;min-width:0">'

  document.getElementById('es-cancel').addEventListener('click',function(){backdrop.remove();});
  document.getElementById('es-save').addEventListener('click',function(){
    var oldAmt=x.amount;
    var oldPoint=x.point;
    var oldMonth=x.monthIdx;
    var oldYear=x.year||2026;
    var newAmt=+document.getElementById('es-amt').value||0;
    var newQty=+document.getElementById('es-qty').value||1;
    var newPt=document.getElementById('es-pt').value.trim();
    var newDt=document.getElementById('es-dt').value.trim();
    var newNote=document.getElementById('es-nt').value.trim();

    var newYear=oldYear;
    try{newMonth=parseInt(newDt.split('.')[1])-1;newYear=parseInt(newDt.split('.')[2]);}catch(e){}
    // Reverse old finance
    var oldFin=getFinance(oldYear);
    if(oldFin&&oldFin[oldMonth]){
      if(oldPoint==='Кафе About')oldFin[oldMonth].incomeAbout=Math.max(0,(oldFin[oldMonth].incomeAbout||0)-oldAmt);
      else oldFin[oldMonth].incomeIG=Math.max(0,(oldFin[oldMonth].incomeIG||0)-oldAmt);
    }

    var newFin=getFinance(newYear);
    if(newFin&&newFin[newMonth]){
      if(newPt==='Кафе About')newFin[newMonth].incomeAbout=(newFin[newMonth].incomeAbout||0)+newAmt;
      else newFin[newMonth].incomeIG=(newFin[newMonth].incomeIG||0)+newAmt;
    }
    // Update sale
    S.sales[idx]=Object.assign({},x,{qty:newQty,amount:newAmt,point:newPt,date:newDt,monthIdx:newMonth,year:newYear,note:newNote,margin:prod&&prod.cost?(newAmt-(prod.cost*newQty)):x.margin});
    backdrop.remove();scheduleSave();render();toast('Продаж оновлено ✓');
  });
}

function confirmSell(productId,backdrop){
  var p=S.products.find(function(x){return x.id===productId;});
  if(!p)return;
  var qty=+document.getElementById('s-qty').value||1;
  var amount=+document.getElementById('s-amt').value||0;
  var point=document.getElementById('s-pt').value;
  var date=document.getElementById('s-dt').value;
  var note=document.getElementById('s-nt').value.trim();

  // Parse month index
  var monthIdx=S.month;
  try{monthIdx=parseInt(date.split('.')[1])-1;}catch(e){}
  if(monthIdx<0||monthIdx>11)monthIdx=S.month;

  // Add sale
  var margin=p.cost?(amount-(p.cost*qty)):null;
  var saleYear=S.purchYear||new Date().getFullYear();
  try{saleYear=parseInt(date.split('.')[2])||saleYear;}catch(e){}
  S.sales.push({id:Date.now(),productId:productId,productName:p.name,qty:qty,amount:amount,cost:p.cost||0,margin:margin,point:point,date:date,monthIdx:monthIdx,year:saleYear,note:note});

  // Update locationStock
  var foundLoc=false;
  p.locationStock=(p.locationStock||[]).map(function(l){
    if(l.loc===point){foundLoc=true;return{loc:l.loc,qty:Math.max(0,l.qty-qty)};}return l;
  });
  // If location not in stock yet (manual sale) - add with 0
  if(!foundLoc&&point)p.locationStock.push({loc:point,qty:0});

  // Update finance via financeByYear
  var sellFin=getFinance(saleYear);
  if(sellFin&&sellFin[monthIdx]){
    if(point==='Кафе About')sellFin[monthIdx].incomeAbout=(sellFin[monthIdx].incomeAbout||0)+amount;
    else sellFin[monthIdx].incomeIG=(sellFin[monthIdx].incomeIG||0)+amount;
  }

  backdrop.remove();
  scheduleSave();
  render();
  toast('Продаж записано ✓ Фінанси оновлено!');
}

function delSale(idx){
  if(!confirm('Видалити запись о продаже?'))return;
  var x=S.sales[idx];
  if(x){
    // Reverse finance - use financeByYear
    var xFin=getFinance(x.year||2026);
    if(xFin&&xFin[x.monthIdx]){
      if(x.point==='Кафе About')xFin[x.monthIdx].incomeAbout=Math.max(0,(xFin[x.monthIdx].incomeAbout||0)-x.amount);
      else xFin[x.monthIdx].incomeIG=Math.max(0,(xFin[x.monthIdx].incomeIG||0)-x.amount);
    }
    // Restore stock
    var prod=S.products.find(function(p){return p.id===x.productId;});
    if(prod){
      var found=false;
      prod.locationStock=(prod.locationStock||[]).map(function(l){
        if(l.loc===x.point){found=true;return{loc:l.loc,qty:l.qty+x.qty};}return l;
      });
      if(!found)prod.locationStock.push({loc:x.point,qty:x.qty});
    }
  }
  S.sales.splice(idx,1);
  scheduleSave();render();toast('Продаж видалено');
}

function pgCalc(){
  if(!S.calc||!Array.isArray(S.calc))S.calc=[{name:'Тросик ювелірний',qty:40,unit:'см',pricePerUnit:0.01,totalPrice:0.40},{name:'Замок карабін',qty:1,unit:'шт',pricePerUnit:6,totalPrice:6},{name:'Коробочка',qty:1,unit:'шт',pricePerUnit:25,totalPrice:25}];
  // Ensure all items have pricePerUnit
  S.calc.forEach(function(item){
    if(!item.pricePerUnit)item.pricePerUnit=item.price||0;
    item.totalPrice=Math.round((item.qty||0)*(item.pricePerUnit||0)*100)/100;
  });

  var cost=S.calc.reduce(function(s,i){return s+(i.totalPrice||0);},0);

  var UNITS=['шт','м','см','нитка','г','кг','мл'];

  var items=S.calc.map(function(item,i){
    var unitOpts=UNITS.map(function(u){return '<option'+(u===(item.unit||'шт')?' selected':'')+'>'+u+'</option>';}).join('');
    return '<div style="border-bottom:1px solid var(--border);padding:10px 0">'
      // Row 1: name + delete
      +'<div style="display:flex;align-items:center;gap:8px;margin-bottom:6px">'

      +'<button class="bx" onclick="S.calc.splice('+i+',1);render()" style="color:var(--red)">✕</button>'
      +'</div>'
      // Row 2: qty + unit + price per unit = total
      +'<div style="display:flex;align-items:center;gap:6px;flex-wrap:wrap">'
      +'<div style="display:flex;flex-direction:column;gap:2px;min-width:70px">'
      +'<label style="font-size:10px;color:var(--muted);font-weight:600">Кількість</label>'

      +'</div>'
      +'<div style="display:flex;flex-direction:column;gap:2px;min-width:80px">'
      +'<label style="font-size:10px;color:var(--muted);font-weight:600">Одиниця</label>'
      +'<select class="fi" style="padding:7px 8px;font-size:13px" onchange="S.calc['+i+'].unit=this.value;updCalc()">'+unitOpts+'</select>'
      +'</div>'
      +'<div style="display:flex;flex-direction:column;gap:2px;min-width:80px">'
      +'<label id="calc-unit-lbl-'+i+'" style="font-size:10px;color:var(--muted);font-weight:600">Ціна за 1 '+(item.unit||'шт')+'</label>'
      +'<input class="fi" type="number" step="0.01" min="0" value="'+item.pricePerUnit+'" oninput="S.calc['+i+'].pricePerUnit=+this.value||0;updCalc()" style="padding:7px 8px;font-size:13px;text-align:right"/>'
      +'</div>'
      +'<div style="display:flex;flex-direction:column;gap:2px;align-items:center">'
      +'<label style="font-size:10px;color:var(--muted);font-weight:600">= Сума</label>'
      +'<div id="calc-total-'+i+'" style="font-size:14px;font-weight:700;color:var(--dark);padding:7px 8px;min-width:60px;text-align:right">'+(item.totalPrice||0).toFixed(2)+' ₴</div>'
      +'</div>'
      +'</div>'
      +'</div>';
  }).join('');

  return '<div>'+ptitle('Калькулятор','Собівартість прикраси')
    +'<div class="card">'
    +'<div class="ctitle">Матеріали та пакування</div>'
    +'<div style="font-size:12px;color:var(--muted);margin-bottom:12px;padding:8px;background:var(--gold-l);border-radius:8px">💡 Тросик — в сантиметрах (40 см на чокер, 20 см на браслет). Ціна за 1 см = вартість катушки ÷ довжина в см (напр. 40 грн ÷ 4000 см = 0.01 грн/см). Камені — в нитках (0.5, 1, 1.5 нитки).</div>'
    +items
    // Add new item
    +'<div style="margin-top:12px;padding-top:12px;border-top:2px dashed var(--border)">'
    +'<div style="font-size:12px;font-weight:600;color:var(--muted);margin-bottom:8px;text-transform:uppercase;letter-spacing:.5px">Додати матеріал</div>'
    +'<div style="display:flex;gap:6px;flex-wrap:wrap;margin-bottom:6px">'
    +['Тросик ювелірний','Замок карабін','Удлинювач','Колечко','Мішечок','Коробочка','Візитка'].map(function(n){

    +'<div class="popts">'

      return '<div class="popt"><div class="pol">×'+m[0]+' '+m[1]+'</div><div class="pop" id="po'+m[0]+'">'+(cost*m[0]).toFixed(0)+' ₴</div><div class="pob">прибуток '+(cost*(m[0]-1)).toFixed(0)+' ₴</div></div>';
    }).join('')
    +'</div></div></div>';
}

function updCalc(){
  S.calc.forEach(function(item,i){
    item.totalPrice=Math.round((item.qty||0)*(item.pricePerUnit||0)*100)/100;
    // Update the = Сума display for this row
    var totalEl=document.getElementById('calc-total-'+i);
    if(totalEl)totalEl.textContent=item.totalPrice.toFixed(2)+' ₴';
    // Update unit label in price field
    var unitLbl=document.getElementById('calc-unit-lbl-'+i);
    if(unitLbl)unitLbl.textContent='Ціна за 1 '+(item.unit||'шт');
  });
  var cost=S.calc.reduce(function(s,i){return s+(i.totalPrice||0);},0);
  var cv=document.getElementById('crv');if(cv)cv.textContent=cost.toFixed(2)+' грн';
  [[3,'po3'],[4,'po4'],[5,'po5']].forEach(function(m){
    var e=document.getElementById(m[1]);
    if(e)e.textContent=(cost*m[0]).toFixed(0)+' ₴';
  });
  try{localStorage.setItem(SK,JSON.stringify(S));}catch(e){}
}

function addCalcItem(){
  var n=document.getElementById('ni-n').value.trim();
  var q=+document.getElementById('ni-q').value||1;
  var u=document.getElementById('ni-u').value||'шт';
  var p=+document.getElementById('ni-p').value||0;
  if(!n)return;
  S.calc.push({name:n,qty:q,unit:u,pricePerUnit:p,totalPrice:Math.round(q*p*100)/100});
  render();
}

function calcHelper(){
  var total=+document.getElementById('helper-total').value||0;
  var qty=+document.getElementById('helper-qty').value||1;
  var unit=document.getElementById('helper-unit').value;
  if(!total||!qty){return;}
  var ppu=Math.round(total/qty*10000)/10000;

  if(el)el.innerHTML='Ціна за 1 <b>'+unit+'</b>: <span style="color:#fff;font-size:16px">'+ppu+'</span> грн &nbsp;→&nbsp; введи це значення в поле нижче';
}

function quickAddCalc(name){

    'Колечко':{qty:4,unit:'шт',pricePerUnit:0.5},
    'Мішечок':{qty:1,unit:'шт',pricePerUnit:10},
    'Коробочка':{qty:1,unit:'шт',pricePerUnit:25},

      return showCards.length?showHtml:'<div class="empty"><div style="font-size:36px;margin-bottom:10px">🛒</div><div>Немає закупок за цей період</div></div>';
    })()
    +'</div>';
}


function pgFinance(){
  if(!S.finMode)S.finMode='month';

  // Get finance data based on mode
  var fm={};
  var finMonths=[];
  if(S.finMode==='month'){
    fm=getFinance(S.year)[S.month]||{};
    finMonths=[fm];
  } else if(S.finMode==='year'){
    finMonths=getFinance(S.year);
    fm={}; // aggregate below
  } else if(S.finMode==='custom'&&S.finFrom&&S.finTo){
    YEARS.forEach(function(y){
      var yf=getFinance(y);
      MO.forEach(function(mn,mi){
        var ms=y+'-'+String(mi+1).padStart(2,'0')+'-01';
        var me=y+'-'+String(mi+1).padStart(2,'0')+'-31';
        if(ms<=S.finTo&&me>=S.finFrom)finMonths.push(yf[mi]||{});
      });
    });
    fm=finMonths[0]||{};
  } else {
    fm=getFinance(S.year)[S.month]||{};
    finMonths=[fm];
  }

  // Aggregate totals
  var inc=finMonths.reduce(function(s,m){return s+(m.incomeIG||0)+(m.incomeAbout||0)+(m.incomeOther||0);},0);
  var exp=finMonths.reduce(function(s,m){return s+(m.expSalary||0)+(m.expTeam||0)+(m.expMaterials||0)+(m.expFurniture||0)+(m.expPackaging||0)+(m.expDeliveryIn||0)+(m.expAds||0)+(m.expSmm||0)+(m.expPhoto||0)+(m.expStudio||0)+(m.expDeliveryOut||0)+(m.expOther||0);},0);
  var profit=inc-exp;

  // Year totals (always show)
  var yFin=getFinance(S.year);
  var yInc=yFin.reduce(function(s,m){return s+(m.incomeIG||0)+(m.incomeAbout||0)+(m.incomeOther||0);},0);
  var yExp=yFin.reduce(function(s,m){return s+(m.expSalary||0)+(m.expTeam||0)+(m.expMaterials||0)+(m.expFurniture||0)+(m.expPackaging||0)+(m.expDeliveryIn||0)+(m.expAds||0)+(m.expSmm||0)+(m.expPhoto||0)+(m.expStudio||0)+(m.expDeliveryOut||0)+(m.expOther||0);},0);

  // Mode tabs
  var modeTabs=['month','year','custom'].map(function(m){
    var labels={month:'Місяць',year:'Рік',custom:'Свій період'};
    var act=S.finMode===m;
    return '<button data-finmode="'+m+'" style="padding:6px 12px;border-radius:8px;font-size:12px;font-weight:600;cursor:pointer;border:1.5px solid '+(act?'var(--dark)':'var(--border)')+';background:'+(act?'var(--dark)':'white')+';color:'+(act?'#fff':'var(--mid)')+'">'+labels[m]+'</button>';
  }).join('');

  var yearTabs2='<div class="mtabs" style="margin-bottom:8px">'+yearTabs(S.year,'fyear')+'</div>';

  var monthTabs=S.finMode==='month'?'<div class="mtabs">'+MO.map(function(m,i){return '<button class="mt'+(i===S.month?' active':'')+'" data-fmonth="'+i+'">'+m.slice(0,3)+'</button>';}).join('')+'</div>':'';

  var customPicker=S.finMode==='custom'?'<div style="margin-top:8px">'
    +'<div style="display:flex;gap:10px;align-items:center;margin-bottom:8px">'
    +'<input type="date" id="fin-from" value="'+S.finFrom+'" class="fi" style="flex:1;padding:8px 10px;font-size:13px"/>'
    +'<span style="color:var(--muted)">—</span>'
    +'<input type="date" id="fin-to" value="'+S.finTo+'" class="fi" style="flex:1;padding:8px 10px;font-size:13px"/>'
    +'</div>'
    +'<button id="fin-apply" style="width:100%;padding:10px;background:var(--dark);color:#fff;border:none;border-radius:10px;font-size:13px;font-weight:600;cursor:pointer;font-family:Inter,sans-serif">🔍 Застосувати</button>'
    +'</div>':'';

  // fi() helper - only editable in month mode
  function fi(k,lbl){
    if(S.finMode==='month'){
      return '<div class="fr"><span class="frl">'+lbl+'</span><input class="fri" type="number" value="'+(fm[k]||'')+'" oninput="getFinance(S.year)[S.month][\''+k+'\']=+this.value||0;scheduleSave()" placeholder="0"/></div>';
    }
    // Read-only aggregated
    var val=finMonths.reduce(function(s,m){return s+(m[k]||0);},0);
    return val>0?'<div class="fr"><span class="frl">'+lbl+'</span><span style="font-weight:600">'+fmt(val)+'</span></div>':'';
  }

  var groups=[
    {l:'👥 Команда / ЗП',c:'#8E44AD',r:[['expSalary','Зарплата (своя)'],['expTeam','Команда / фрілансери']]},
    {l:'📦 Виробництво',c:'#2980B9',r:[['expMaterials','Матеріали'],['expFurniture','Фурнітура'],['expPackaging','Пакування'],['expDeliveryIn','Доставка матеріалів']]},
    {l:'📣 Маркетинг',c:'#E67E22',r:[['expAds','Реклама / трафік'],['expSmm','SMM'],['expPhoto','Фотограф / зйомка'],['expStudio','Оренда студії']]},
    {l:'🚚 Доставка клієнтам',c:'#27AE60',r:[['expDeliveryOut','Доставка клієнтам']]},
    {l:'📋 Інше',c:'#7F8C8D',r:[['expOther','Інші витрати']]},
  ];

  var expHtml=groups.map(function(g){
    var gt=finMonths.reduce(function(s,m){return s+g.r.reduce(function(ss,r){return ss+(m[r[0]]||0);},0);},0);
    return '<div style="margin-bottom:12px">'
      +'<div style="display:flex;justify-content:space-between;padding:6px 0;border-bottom:2px solid '+g.c+'33">'
      +'<span style="font-size:12px;font-weight:700;color:'+g.c+'">'+g.l+'</span>'
      +(gt?'<span style="font-size:12px;font-weight:700;color:'+g.c+'">'+fmtN(gt)+' грн</span>':'')
      +'</div>'
      +g.r.map(function(r){return fi(r[0],r[1]);}).filter(Boolean).join('')
      +'</div>';
  }).join('');

  var periodLabel=S.finMode==='month'?MO[S.month]+' '+S.year
    :S.finMode==='year'?S.year+' рік'
    :(S.finFrom&&S.finTo?S.finFrom+' — '+S.finTo:'Свій період');

  return '<div>'+ptitle('Фінанси','Доходи та витрати')
    +'<div style="display:flex;gap:6px;margin-bottom:8px">'+modeTabs+'</div>'
    +yearTabs2
    +monthTabs
    +customPicker
    +'<div style="font-size:12px;color:var(--muted);margin:8px 0 14px;font-weight:600">📅 '+periodLabel+'</div>'
    +'<div class="card"><div class="ctitle">💚 Доходи</div>'
    +fi('incomeIG','Instagram')+fi('incomeAbout','Кафе About')+fi('incomeOther','Інше')
    +'<div class="ftot"><span class="ftl">Разом дохід</span><span class="ftv" style="color:var(--gold)">'+fmtN(inc)+' грн</span></div>'
    +'</div>'
    +'<div class="card"><div class="ctitle">🔴 Витрати за статтями</div>'+expHtml
    +'<div class="ftot"><span class="ftl">Разом витрати</span><span class="ftv" style="color:#E74C3C">'+fmtN(exp)+' грн</span></div>'
    +'</div>'
    +'<div class="card"><div class="ctitle">📅 Підсумки '+S.year+' року</div>'
    +'<div class="fr"><span class="frl">Дохід за рік</span><span style="font-weight:700;color:var(--green)">'+fmt(yInc)+'</span></div>'
    +'<div class="fr"><span class="frl">Витрати за рік</span><span style="font-weight:700;color:var(--red)">'+fmt(yExp)+'</span></div>'
    +'<div class="ftot"><span class="ftl">Прибуток за рік</span><span class="ftv" style="color:'+(yInc-yExp>=0?'var(--gold)':'#E74C3C')+'">'+fmtN(yInc-yExp)+' грн</span></div>'
    +'</div>'
    +'<div class="pb"><div class="pbl">Чистий прибуток — '+periodLabel+'</div>'
    +'<div class="pbv" style="color:'+(profit>=0?'var(--gold)':'#E74C3C')+'">'+fmtN(profit)+' грн</div>'
    +'</div></div>';
}


// ── Marketing page ────────────────────────────────────────────────────────────
function pgMarketing(){
  if(!S.marketing)S.marketing={links:[],photoshoots:[]};
  if(!Array.isArray(S.marketing.links))S.marketing.links=[];
  if(!Array.isArray(S.marketing.photoshoots))S.marketing.photoshoots=[];
  var m=S.marketing;

  // Predefined categories
  var MCAT=[
    {key:'instagram', label:'📸 Instagram', icon:'📸'},
    {key:'brandbook', label:'🎨 Брендбук', icon:'🎨'},
    {key:'logo', label:'🔤 Логотип', icon:'🔤'},
    {key:'packaging', label:'📦 Пакування', icon:'📦'},
    {key:'audience', label:'👥 Цільова аудиторія', icon:'👥'},
    {key:'competitors', label:'🔍 Конкуренти', icon:'🔍'},
    {key:'content', label:'🎬 Контент-план', icon:'🎬'},
    {key:'analytics', label:'📊 Аналітика', icon:'📊'},
    {key:'other', label:'📎 Інше', icon:'📎'},
  ];

  // Group links by category
  var grouped={};
  MCAT.forEach(function(c){grouped[c.key]=[];});
  (m.links||[]).forEach(function(l,i){
    var cat=l.category||'other';
    if(!grouped[cat])grouped[cat]=[];
    grouped[cat].push({link:l,idx:i});
  });

  var catCards=MCAT.map(function(cat){
    var items=grouped[cat.key]||[];
    var itemsHtml=items.map(function(item){
      return '<div class="fr" style="align-items:flex-start">'
        +'<div style="flex:1;min-width:0">'
        +'<div style="font-size:13px;font-weight:600;margin-bottom:2px">'+esc(item.link.name||item.link.url)+'</div>'
        +(item.link.desc?'<div style="font-size:11px;color:var(--muted);margin-bottom:4px">'+esc(item.link.desc)+'</div>':'')
        +'<a href="'+esc(item.link.url)+'" target="_blank" style="font-size:12px;color:var(--gold);font-weight:600;text-decoration:none;word-break:break-all">🔗 '+esc(item.link.url.replace('https://','').slice(0,40))+'...</a>'
        +'</div>'
        +'<button data-dellink="'+item.idx+'" class="bx" style="color:var(--red);flex-shrink:0">🗑️</button>'
        +'</div>';
    }).join('');

    return '<div class="card" style="margin-bottom:12px">'
      +'<div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:'+(items.length?'10px':'0')+'">'
      +'<div class="ctitle" style="margin:0">'+cat.label+'</div>'
      +'<button data-addlink="'+cat.key+'" style="font-size:12px;color:var(--gold);font-weight:600;background:none;border:none;cursor:pointer">+ Додати</button>'
      +'</div>'
      +(itemsHtml||'<div style="font-size:12px;color:var(--muted);padding:4px 0">Немає посилань</div>')
      +'</div>';
  }).join('');

  // ROI
  var yFin=getFinance(S.year);
  var adSpend=yFin.reduce(function(s,mo){return s+(mo.expAds||0)+(mo.expSmm||0)+(mo.expPhoto||0)+(mo.expStudio||0);},0);
  var igRev=yFin.reduce(function(s,mo){return s+(mo.incomeIG||0);},0);
  var roi=adSpend>0?Math.round(((igRev-adSpend)/adSpend)*100):0;

  // Photoshoots
  var psCards=(m.photoshoots||[]).map(function(ps,i){
    var sc=ps.status==='Готово'?'var(--green)':ps.status==='Опубліковано'?'#8E44AD':'var(--gold)';
    return '<div class="prc" style="margin-bottom:10px">'
      +'<div class="prc-h"><div>'
      +'<div class="prc-name">📸 '+esc(ps.date||'')+(ps.photographer?' · '+esc(ps.photographer):'')+'</div>'
      +(ps.models?'<div class="prc-meta">Моделі: '+esc(ps.models)+'</div>':'')
      +'</div>'
      +'<div style="display:flex;align-items:center;gap:8px">'
      +'<span style="font-size:11px;font-weight:700;color:'+sc+'">'+esc(ps.status||'В роботі')+'</span>'
      +'<button class="bx" data-delps="'+i+'" style="color:var(--red)">🗑️</button>'
      +'</div></div>'
      +(ps.items?'<div style="font-size:12px;color:var(--muted);margin-bottom:4px">'+esc(ps.items)+'</div>':'')
      +(ps.results?'<div style="font-size:12px;color:var(--muted);margin-bottom:4px">'+esc(ps.results)+'</div>':'')
      +(ps.driveUrl?'<a href="'+esc(ps.driveUrl)+'" target="_blank" style="font-size:12px;color:var(--gold);font-weight:600;text-decoration:none">🔗 Папка з фото</a>':'')
      +'</div>';
  }).join('');

  return '<div>'+ptitle('Маркетинг','Посилання, фотосесії та аналітика')
    // ROI block
    +'<div class="card" style="margin-bottom:14px"><div class="ctitle">📊 ROI реклами '+S.year+'</div>'
    +'<div class="fr"><span class="frl">Витрати на маркетинг</span><span style="font-weight:700;color:var(--red)">'+fmt(adSpend)+'</span></div>'
    +'<div class="fr"><span class="frl">Дохід з Instagram</span><span style="font-weight:700;color:var(--green)">'+fmt(igRev)+'</span></div>'
    +'<div class="ftot"><span class="ftl">ROI реклами</span><span class="ftv" style="color:'+(roi>=0?'var(--gold)':'#E74C3C')+'">'+(roi>=0?'+':'')+roi+'%</span></div>'
    +'</div>'
    // Links by category
    +catCards
    // Photoshoots
    +'<div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:12px">'
    +'<div class="ctitle" style="margin:0">📸 Фотосесії ('+(m.photoshoots||[]).length+')</div>'
    +'<button class="btn btn-red btn-sm" id="add-ps-btn">+ Додати</button>'
    +'</div>'
    +(psCards||'<div class="empty" style="padding:16px 0"><div style="font-size:28px;margin-bottom:8px">📷</div><div>Ще немає фотосесій</div></div>')
    +'</div>';
}

function detectCategory(name) {
  var n = (name||'').toLowerCase();
  if(n.includes('браслет')) return 'браслет';
  if(n.includes('чокер')) return 'чокер';
  if(n.includes('колье') || n.includes('кольє')) return 'колье';
  if(n.includes('кольцо') || n.includes('кільце')) return 'кольцо';
  if(n.includes('серьг') || n.includes('сережк')) return 'серьги';
  if(n.includes('брошь') || n.includes('брош')) return 'брошь';
  if(n.includes('комплект')) return 'комплект';
  return 'другое';
}

function renderLocList(){

    chip.className='lchip';chip.style.flex='1';chip.textContent='📍 '+l.loc;
    var inp=document.createElement('input');
    inp.type='number';inp.value=l.qty;
    inp.style.cssText='width:56px;padding:6px 8px;border:1.5px solid var(--border);border-radius:8px;font-size:13px;text-align:center;outline:none';
    inp.addEventListener('change',function(){locItems[i].qty=+this.value||0;});
    var del=document.createElement('button');
    del.className='bx';del.style.color='var(--red)';del.textContent='×';
    del.addEventListener('click',function(){locItems.splice(i,1);renderLocList();});
    row.appendChild(chip);row.appendChild(inp);
    row.appendChild(document.createTextNode('шт'));
    row.appendChild(del);
    el.appendChild(row);
  });

function addLoc(){
  var n=document.getElementById('lc-n').value.trim();
  var q=+document.getElementById('lc-q').value||1;

  locItems.push({loc:n,qty:q});

function quickLoc(v){
  if(!locItems.find(function(l){return l.loc===v;})){locItems.push({loc:v,qty:1});renderLocList();}

    var w=document.getElementById('ai-pw');
    if(w)w.innerHTML='<img src="'+e.target.result+'" style="width:80px;height:80px;object-fit:cover;border-radius:10px;margin-bottom:6px"/>';
  };
  reader.readAsDataURL(file);
}

async function doAiFill(){
  var text=(document.getElementById('ai-text')||{}).value||'';
  if(!text&&!aiImg){alert('Добавь фото или описание');return;}
  var btn=document.getElementById('ai-btn');
  if(btn){btn.innerHTML='<div class="spin"></div> AI заполняет…';btn.disabled=true;}
  try{
    var content=[];
    if(aiImg)content.push({type:'image',source:{type:'base64',media_type:aiImg.type,data:aiImg.data}});
    content.push({type:'text',text:'Заполни карточку украшения. Верни ТОЛЬКО JSON без markdown:\n{"name":"","desc":"","material":"","price1":0,"comp2":"","price2":0,"comp3":"","price3":0,"stock":1,"status":"Активний","cost":0,"img":"💎"}\n\nИнформация: '+(text||'смотри на фото')});
    var res=await fetch('https://api.anthropic.com/v1/messages',{method:'POST',headers:{'Content-Type':'application/json','anthropic-version':'2023-06-01','anthropic-dangerous-direct-browser-access':'true'},body:JSON.stringify({model:'claude-sonnet-4-6',max_tokens:1000,messages:[{role:'user',content:content}]})});
    var data=await res.json();
    var raw=(data.content||[]).find(function(b){return b.type==='text';});
    if(raw){var parsed=JSON.parse(raw.text.replace(/```json?|```/g,'').trim());openProductModal(parsed);toast('AI заполнил карточку ✓');}
  }catch(e){alert('Помилка AI: '+e.message);}
  if(btn){btn.innerHTML='✨ Заповнити через AI';btn.disabled=false;}
}

// ── Global event delegator (attached once, handles all pages) ─────────────
document.addEventListener('click', function(e){
  var area = document.getElementById('area');
  if(!area || !area.contains(e.target)) return;

  // ── Navigation data attributes ──────────────────────────────────────────
  var dashMode = e.target.closest('[data-dashmode]');
  if(dashMode){S.dashMode=dashMode.getAttribute('data-dashmode');render();return;}
  var dashYear = e.target.closest('[data-dashyear]');
  if(dashYear){S.dashYear=+dashYear.getAttribute('data-dashyear');render();return;}
  var dashMonth = e.target.closest('[data-dashmonth]');
  if(dashMonth){S.dashMonth=+dashMonth.getAttribute('data-dashmonth');render();return;}

  var finMode = e.target.closest('[data-finmode]');
  if(finMode){S.finMode=finMode.getAttribute('data-finmode');render();return;}
  var finYear = e.target.closest('[data-fyear]');
  if(finYear){S.year=+finYear.getAttribute('data-fyear');if(!S.financeByYear[String(S.year)])S.financeByYear[String(S.year)]=makeFinance();render();return;}
  var finMonth = e.target.closest('[data-fmonth]');
  if(finMonth){S.month=+finMonth.getAttribute('data-fmonth');render();return;}

  var purchMode = e.target.closest('[data-purchmode]');
  if(purchMode){S.purchMode=purchMode.getAttribute('data-purchmode');render();return;}
  var purchYear = e.target.closest('[data-pyear]');
  if(purchYear){S.purchYear=+purchYear.getAttribute('data-pyear');render();return;}
  var purchMonth = e.target.closest('[data-pmonth]');
  if(purchMonth){S.pmonth=+purchMonth.getAttribute('data-pmonth');render();return;}

  // ── Catalog ──────────────────────────────────────────────────────────────
  var cat = e.target.closest('[data-cat]');
  if(cat){S.filter=cat.getAttribute('data-cat');render();return;}

  var toggleCat = e.target.closest('[data-togglecat]');
  if(toggleCat && !e.target.closest('button') && !e.target.closest('input') && !e.target.closest('a')){
    var el=document.getElementById('cat-card-'+toggleCat.getAttribute('data-togglecat'));
    if(el)el.style.display=el.style.display==='none'?'block':'none';
    return;
  }
  var editP = e.target.closest('[data-edit]');
  if(editP){var p=S.products.find(function(x){return x.id===+editP.getAttribute('data-edit');});if(p)openProductModal(p);return;}
  var delP = e.target.closest('[data-del]');
  if(delP&&confirm('Видалити товар?')){S.products=S.products.filter(function(x){return x.id!==+delP.getAttribute('data-del');});scheduleSave();render();toast('Товар видалено');return;}
  var sellBtn = e.target.closest('.sell-btn');
  if(sellBtn){openSellModal(+sellBtn.getAttribute('data-pid'));return;}
  var addLp = e.target.closest('[data-addlp]');
  if(addLp){
    var pid=+addLp.getAttribute('data-addlp');
    var locEl=document.getElementById('lp-loc-'+pid);
    var priceEl=document.getElementById('lp-price-'+pid);
    if(locEl&&priceEl&&locEl.value.trim()&&priceEl.value){
      var prod=S.products.find(function(x){return x.id===pid;});
      if(prod){
        if(!prod.locationPrices)prod.locationPrices=[];
        var existing=prod.locationPrices.find(function(lp){return lp.loc===locEl.value.trim();});
        if(existing)existing.price=+priceEl.value;
        else prod.locationPrices.push({loc:locEl.value.trim(),price:+priceEl.value});
        scheduleSave();render();toast('Ціну збережено ✓');
      }
    }
    return;
  }
  var delLp = e.target.closest('[data-dellp]');
  if(delLp){
    var pid=+delLp.getAttribute('data-dellp');
    var li=+delLp.getAttribute('data-lpidx');
    var prod=S.products.find(function(x){return x.id===pid;});
    if(prod&&prod.locationPrices){prod.locationPrices.splice(li,1);scheduleSave();render();}
    return;
  }

  // ── Purchases ────────────────────────────────────────────────────────────
  var toggleCard = e.target.closest('[data-togglecard]');
  if(toggleCard&&!e.target.closest('button')&&!e.target.closest('input')){
    var el=document.getElementById('pcard-'+toggleCard.getAttribute('data-togglecard'));
    if(el)el.style.display=el.style.display==='none'?'block':'none';
    return;
  }
  var delPurch = e.target.closest('[data-delpurch]');
  if(delPurch){
    if(!confirm('Видалити закупку?'))return;
    var pid=+delPurch.getAttribute('data-delpurch');
    var x=S.purchases.find(function(p){return p.id===pid;});
    if(x){var dFin=getFinance(x.year||2026);if(dFin&&dFin[x.monthIdx])dFin[x.monthIdx].expMaterials=Math.max(0,(dFin[x.monthIdx].expMaterials||0)-x.amount);}
    S.purchases=S.purchases.filter(function(p){return p.id!==pid;});
    scheduleSave();render();toast('Закупку видалено');return;
  }
  var usedDelta = e.target.closest('[data-useddelta]');
  if(usedDelta){
    var uid=+usedDelta.getAttribute('data-useddelta');
    var delta=+usedDelta.getAttribute('data-delta');
    var p=S.purchases.find(function(x){return x.id===uid;});
    if(p){p.used=Math.max(0,Math.min(p.qty||0,(p.used||0)+delta));scheduleSave();render();}
    return;
  }
  var trackId = e.target.closest('[data-trackid]');
  if(trackId){var tp=S.purchases.find(function(x){return x.id===+trackId.getAttribute('data-trackid');});if(tp){tp.autoTrack=e.target.checked;scheduleSave();}return;}
  var editPurch = e.target.closest('[data-editpurch]');
  if(editPurch){var pp=S.purchases.find(function(x){return x.id===+editPurch.getAttribute('data-editpurch');});if(pp)openPurchaseModal(pp);return;}
  var dismissR = e.target.closest('[data-dismissrestock]');
  if(dismissR){if(!S.dismissedRestock)S.dismissedRestock=[];S.dismissedRestock.push(+dismissR.getAttribute('data-dismissrestock'));scheduleSave();render();return;}
  var clearR = e.target.closest('[data-clearrestock]');
  if(clearR){if(!S.dismissedRestock)S.dismissedRestock=[];S.purchases.filter(function(p){return p.autoTrack!==false&&Math.max(0,(p.qty||0)-(p.used||0))===0;}).forEach(function(p){if(S.dismissedRestock.indexOf(p.id)===-1)S.dismissedRestock.push(p.id);});scheduleSave();render();return;}
  var delSup = e.target.closest('[data-delsup]');
  if(delSup){var idx=+delSup.getAttribute('data-delsup');if(confirm('Видалити постачальника?')){S.suppliers.splice(idx,1);scheduleSave();render();toast('Видалено');}return;}

  // ── Marketing ────────────────────────────────────────────────────────────
  var delPs = e.target.closest('[data-delps]');
  if(delPs){var idx=+delPs.getAttribute('data-delps');if(confirm('Видалити?')){S.marketing.photoshoots.splice(idx,1);scheduleSave();render();toast('Видалено');}return;}
  var addLink = e.target.closest('[data-addlink]');
  if(addLink){openAddLinkModal(addLink.getAttribute('data-addlink'));return;}
  var delLink = e.target.closest('[data-dellink]');
  if(delLink){var idx=+delLink.getAttribute('data-dellink');if(confirm('Видалити?')){S.marketing.links.splice(idx,1);scheduleSave();render();}return;}

  // ── Scripts ──────────────────────────────────────────────────────────────
  var sCat = e.target.closest('[data-scat]');
  if(sCat){S.scriptsCat=sCat.getAttribute('data-scat');render();return;}
  var editScript = e.target.closest('[data-editscript]');
  if(editScript){openScriptModal(+editScript.getAttribute('data-editscript'));return;}
  var copyScript = e.target.closest('[data-copyscript]');
  if(copyScript){
    var s=(S.scripts||[]).find(function(x){return x.id===+copyScript.getAttribute('data-copyscript');});
    if(s)navigator.clipboard.writeText(s.text).then(function(){toast('Скопійовано 📋');});
    return;
  }

  // ── Sales ────────────────────────────────────────────────────────────────
  var delSaleEl=e.target.closest('[data-delsale]');
  if(delSaleEl){
    if(!confirm('Видалити запис про продаж?'))return;
    var idx=+delSaleEl.getAttribute('data-delsale');
    var x=S.sales[idx];
    if(x){
      var xFin=getFinance(x.year||2026);
      if(xFin&&xFin[x.monthIdx]){
        if(x.point==='Кафе About')xFin[x.monthIdx].incomeAbout=Math.max(0,(xFin[x.monthIdx].incomeAbout||0)-x.amount);
        else xFin[x.monthIdx].incomeIG=Math.max(0,(xFin[x.monthIdx].incomeIG||0)-x.amount);
      }
      var sprod=S.products.find(function(p){return p.id===x.productId;});
      if(sprod){
        var sfound=false;
        sprod.locationStock=(sprod.locationStock||[]).map(function(l){
          if(l.loc===x.point){sfound=true;return{loc:l.loc,qty:l.qty+(x.qty||1)};}return l;
        });
        if(!sfound&&x.point)sprod.locationStock.push({loc:x.point,qty:x.qty||1});
      }
    }
    S.sales.splice(idx,1);
    scheduleSave();render();toast('Продаж видалено');
    return;
  }
  var editSaleEl=e.target.closest('[data-editsale]');
  if(editSaleEl){openEditSaleModal(+editSaleEl.getAttribute('data-editsale'));return;}
});
