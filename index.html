<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1.0"/>
<meta name="mobile-web-app-capable" content="yes"/>
<meta name="apple-mobile-web-app-capable" content="yes"/>
<title>Miro Jewelry</title>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet"/>
<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
:root{
  --red:#C0392B;--red-p:#FDF1F0;
  --gold:#C9A96E;--gold-l:#F5EDD8;
  --dark:#1A1A1A;--mid:#4A4A4A;--muted:#8A8A8A;
  --border:#E8E0D8;--bg:#FAF8F5;--white:#FFF;
  --green:#27AE60;--green-p:#EAF7EE;
  --sb:env(safe-area-inset-bottom,0px);
}
html,body{min-height:100vh;background:var(--bg);font-family:'Inter',sans-serif;color:var(--dark)}
#app{display:flex;flex-direction:column;min-height:100vh}
/* Header */
.hdr{background:var(--dark);padding:14px 18px;display:flex;align-items:center;justify-content:space-between;flex-shrink:0}
.logo{font-family:'Cormorant Garamond',serif;font-size:22px;font-weight:700;color:#fff;letter-spacing:1px}
.logo-s{font-size:9px;color:var(--gold);letter-spacing:3px;text-transform:uppercase;margin-top:1px}
#sync{font-size:10px;color:#888}
/* Scroll */
.scroll{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;padding:16px 16px calc(72px + var(--sb))}
/* Bottom nav */
.bnav{position:fixed;bottom:0;left:0;right:0;background:var(--dark);display:flex;padding:6px 0 calc(6px + var(--sb));z-index:50;border-top:1px solid #2a2a2a}
.ni{flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;cursor:pointer;padding:3px 0}
.ni span:first-child{font-size:19px;line-height:1}
.ni span:last-child{font-size:10px;color:#666;font-weight:500}
.ni.active span:last-child{color:var(--gold)}
/* Desktop */
@media(min-width:768px){
  #app{flex-direction:row}
  .hdr{display:none}
  .bnav{position:fixed;left:0;top:0;bottom:0;width:200px;flex-direction:column;padding:0;border-top:none;border-right:1px solid #2a2a2a;justify-content:flex-start;overflow:hidden}
  .bnav::before{content:'miro';font-family:'Cormorant Garamond',serif;font-size:22px;font-weight:700;color:#fff;letter-spacing:1px;padding:24px 22px 2px;display:block}
  .bnav::after{content:'JEWELRY PLATFORM';font-size:9px;color:var(--gold);letter-spacing:3px;padding:0 22px 16px;display:block;border-bottom:1px solid #2a2a2a;margin-bottom:6px}
  .ni{flex:none;flex-direction:row;padding:12px 22px;gap:10px;justify-content:flex-start;border-left:3px solid transparent}
  .ni.active{background:#252525;border-left-color:var(--gold)}
  .ni span:first-child{font-size:16px}
  .ni span:last-child{font-size:13px;color:#888}
  .ni.active span:last-child{color:#fff}
  .scroll{margin-left:200px;padding:26px 30px 40px}
  .stats-grid{grid-template-columns:repeat(4,1fr)!important}
  .modal-backdrop{align-items:center}
  .modal{border-radius:16px;max-width:600px;margin:auto}
  #dsync{display:block!important}
}
/* Base */
.card{background:var(--white);border:1px solid var(--border);border-radius:14px;padding:16px;margin-bottom:14px}
.ctitle{font-size:11px;font-weight:600;color:var(--muted);letter-spacing:1px;text-transform:uppercase;margin-bottom:12px}
.stats-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:14px}
.stat{background:var(--white);border:1px solid var(--border);border-radius:14px;padding:14px}
.slabel{font-size:10px;color:var(--muted);text-transform:uppercase;letter-spacing:.5px;margin-bottom:6px}
.sval{font-family:'Cormorant Garamond',serif;font-size:26px;font-weight:700}
.ssub{font-size:10px;color:var(--green);margin-top:2px}
/* Buttons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;padding:10px 18px;border-radius:10px;font-size:13px;font-weight:600;cursor:pointer;border:none;font-family:'Inter',sans-serif;width:100%}
.btn-red{background:var(--red);color:#fff}
.btn-gold{background:var(--gold);color:#fff}
.btn-out{background:transparent;border:1.5px solid var(--border);color:var(--mid)}
.btn-sm{padding:6px 13px;font-size:12px;width:auto}
.bx{background:transparent;border:none;font-size:18px;cursor:pointer;color:var(--muted);padding:4px;line-height:1}
/* Forms */
.fg{margin-bottom:13px}
.fg label{display:block;font-size:11px;font-weight:600;color:var(--mid);margin-bottom:4px;text-transform:uppercase;letter-spacing:.5px}
.fi{width:100%;padding:11px 13px;border:1.5px solid var(--border);border-radius:10px;font-size:14px;color:var(--dark);background:var(--white);outline:none;font-family:'Inter',sans-serif;-webkit-appearance:none}
.fi:focus{border-color:var(--gold)}
.frow{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.fta{width:100%;padding:11px 13px;border:1.5px solid var(--border);border-radius:10px;font-size:14px;color:var(--dark);background:var(--white);outline:none;resize:vertical;font-family:'Inter',sans-serif;min-height:70px}
/* Product card */
.pc{background:var(--white);border:1px solid var(--border);border-radius:14px;padding:14px;margin-bottom:12px;display:flex;gap:12px}
.pi{width:52px;height:52px;border-radius:10px;background:var(--bg);border:1px solid var(--border);display:flex;align-items:center;justify-content:center;font-size:24px;flex-shrink:0}
.pinfo{flex:1;min-width:0}
.pname{font-weight:600;font-size:14px;margin-bottom:2px}
.pdesc{font-size:11px;color:var(--muted);margin-bottom:6px;line-height:1.4}
.pprices{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:6px}
.pchip{background:var(--bg);border:1px solid var(--border);border-radius:6px;padding:3px 8px;font-size:11px;font-weight:600}
/* Badges */
.badge{display:inline-flex;padding:3px 9px;border-radius:20px;font-size:11px;font-weight:600}
.b-hit{background:#FFF3CD;color:var(--red)}
.b-active{background:var(--green-p);color:var(--green)}
.b-archive{background:#F0F0F0;color:#888}
/* Purchase card */
.prc{background:var(--white);border:1px solid var(--border);border-radius:12px;padding:14px;margin-bottom:10px}
.prc-h{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:8px}
.prc-name{font-weight:600;font-size:14px}
.prc-meta{font-size:11px;color:var(--muted);margin-top:2px}
.prc-row{display:flex;justify-content:space-between;padding:6px 0;border-bottom:1px solid var(--border);font-size:13px}
.prc-row:last-child{border-bottom:none}
/* Finance */
.fr{display:flex;align-items:center;justify-content:space-between;padding:9px 0;border-bottom:1px solid var(--border)}
.fr:last-child{border-bottom:none}
.frl{font-size:13px;color:var(--mid)}
.fri{width:115px;padding:7px 9px;border:1.5px solid var(--border);border-radius:8px;font-size:13px;font-weight:600;text-align:right;outline:none;font-family:'Inter',sans-serif}
.fri:focus{border-color:var(--gold)}
.ftot{background:var(--dark);border-radius:12px;padding:14px 18px;display:flex;justify-content:space-between;align-items:center;margin-top:12px}
.ftl{font-size:12px;color:#999}
.ftv{font-family:'Cormorant Garamond',serif;font-size:22px;font-weight:700;color:var(--gold)}
.pb{background:var(--dark);border-radius:14px;padding:20px;text-align:center;margin-top:14px}
.pbl{font-size:11px;color:#888;text-transform:uppercase;letter-spacing:1px;margin-bottom:4px}
.pbv{font-family:'Cormorant Garamond',serif;font-size:38px;font-weight:700}
/* Month tabs */
.mtabs{display:flex;gap:6px;overflow-x:auto;padding-bottom:4px;margin-bottom:14px;-webkit-overflow-scrolling:touch}
.mtabs::-webkit-scrollbar{display:none}
.mt{flex-shrink:0;padding:7px 13px;border-radius:8px;font-size:12px;font-weight:600;cursor:pointer;border:1.5px solid var(--border);color:var(--mid);background:white}
.mt.active{background:var(--dark);color:white;border-color:var(--dark)}
/* Calc */
.ci{display:flex;align-items:center;gap:8px;padding:8px 0;border-bottom:1px solid var(--border)}
.cr{background:var(--dark);border-radius:14px;padding:20px;margin-top:14px}
.crl{font-size:11px;color:#888;text-transform:uppercase;letter-spacing:1px;margin-bottom:4px}
.crv{font-family:'Cormorant Garamond',serif;font-size:36px;font-weight:700;color:#fff;margin-bottom:16px}
.popts{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.popt{background:#252525;border-radius:10px;padding:13px 8px;text-align:center}
.pol{font-size:10px;color:#888;margin-bottom:4px}
.pop{font-size:17px;font-weight:700;color:var(--gold)}
.pob{font-size:10px;color:#555;margin-top:3px}
/* AI zone */
.aiz{border:2px dashed var(--gold);border-radius:12px;padding:18px;text-align:center;background:var(--gold-l);cursor:pointer;margin-bottom:12px}
/* Modal */
.modal-backdrop{position:fixed;inset:0;background:rgba(0,0,0,.55);z-index:200;display:flex;flex-direction:column;justify-content:flex-end}
.modal{background:var(--white);border-radius:20px 20px 0 0;padding:20px 20px calc(20px + var(--sb));max-height:90vh;overflow-y:auto;-webkit-overflow-scrolling:touch}
.mhandle{width:40px;height:4px;background:var(--border);border-radius:2px;margin:0 auto 16px}
.mtitle{font-family:'Cormorant Garamond',serif;font-size:22px;font-weight:700;margin-bottom:16px}
.mact{display:flex;gap:10px;margin-top:16px}
.mact .btn{flex:1}
/* Sell btn */
.sell-btn{background:var(--green);color:#fff;border:none;border-radius:8px;padding:5px 12px;font-size:11px;font-weight:600;cursor:pointer}
/* Loc chip */
.lchip{background:var(--gold-l);border:1px solid var(--gold);border-radius:6px;padding:2px 8px;font-size:11px;font-weight:600;color:#8B6914}
/* Toast */
.toast{position:fixed;top:20px;left:50%;transform:translateX(-50%);background:var(--dark);color:#fff;padding:10px 20px;border-radius:10px;font-size:13px;font-weight:600;z-index:300;opacity:0;transition:opacity .3s;pointer-events:none}
.toast.show{opacity:1}
.empty{text-align:center;padding:40px 20px;color:var(--muted)}
.shead{font-size:11px;font-weight:600;color:var(--muted);text-transform:uppercase;letter-spacing:1px;margin:14px 0 8px}
#dsync{display:none;padding:14px 22px;font-size:11px;color:#666;border-top:1px solid #2a2a2a;margin-top:auto}
@keyframes spin{to{transform:rotate(360deg)}}
.spin{width:15px;height:15px;border:2px solid rgba(255,255,255,.3);border-top-color:#fff;border-radius:50%;animation:spin .8s linear infinite}
</style>
</head>

// ── Load & validate ───────────────────────────────────────────────────────────
function validate(s){
  if(!s||typeof s!=='object')return JSON.parse(JSON.stringify(DEF));
  var pages=['dashboard','catalog','sales','calc','purchases','finance'];
  if(pages.indexOf(s.page)===-1)s.page='dashboard';
  if(!Array.isArray(s.products))s.products=JSON.parse(JSON.stringify(PRODUCTS_DEFAULT));
  if(!Array.isArray(s.purchases))s.purchases=[];
  if(!Array.isArray(s.sales))s.sales=[];
  if(!s.filter)s.filter='all';
  if(!Array.isArray(s.calc))s.calc=JSON.parse(JSON.stringify(DEF.calc));
  if(!Array.isArray(s.finance)||s.finance.length<12)s.finance=makeFinance();
  if(typeof s.month!=='number'||s.month<0||s.month>11)s.month=7;
  s.finance=MO.map(function(m,i){return Object.assign({},makeFinance()[i],s.finance[i]||{});});
  return s;
}

var S;
try{
  var raw=localStorage.getItem(SK);

// ── Helpers ───────────────────────────────────────────────────────────────────
function fmt(n){return n?Number(n).toLocaleString('ru')+' грн':'—';}
function fmtN(n){return Number(n||0).toLocaleString('ru');}
function esc(s){return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');}
function toast(msg){var t=document.getElementById('toast');t.textContent=msg;t.classList.add('show');setTimeout(function(){t.classList.remove('show');},2000);}

function go(page){
  S.page=page;
  render();
  var a=document.getElementById('area');
  if(a)a.scrollTop=0;
}

document.getElementById('bnav').addEventListener('click',function(e){
  var ni=e.target.closest('.ni');
  if(ni&&ni.getAttribute('data-p'))go(ni.getAttribute('data-p'));
});

// ── Render ────────────────────────────────────────────────────────────────────
function render(){
  var area=document.getElementById('area');
  if(!area)return;
  var html='';
  try{
    if(S.page==='dashboard')html=pgDash();
    else if(S.page==='catalog')html=pgCatalog();
    else if(S.page==='sales')html=pgSales();
    else if(S.page==='calc')html=pgCalc();
    else if(S.page==='purchases')html=pgPurchases();
    else if(S.page==='finance')html=pgFinance();
    else{S.page='dashboard';html=pgDash();}
  }catch(e){
    html='<div style="padding:20px;color:red;font-size:13px"><b>Ошибка:</b> '+esc(e.message)+'</div>';
    console.error(e);
  }
  area.innerHTML=html;
  // Catalog button delegation (avoids onclick quote issues)
  if(S.page==='catalog'){
    var area2=document.getElementById('area');
    if(area2){
      area2.addEventListener('click',function catClick(e){
        var cat=e.target.closest('[data-cat]');
        if(cat){S.filter=cat.getAttribute('data-cat');render();return;}
        var edit=e.target.closest('[data-edit]');
        if(edit){var p=S.products.find(function(x){return x.id===+edit.getAttribute('data-edit');});if(p)openProductModal(p);return;}
        var del=e.target.closest('[data-del]');
        if(del&&confirm('Удалить товар?')){S.products=S.products.filter(function(x){return x.id!==+del.getAttribute('data-del');});scheduleSave();render();toast('Товар удалён');return;}
        var sell=e.target.closest('.sell-btn');
        if(sell){openSellModal(+sell.getAttribute('data-pid'));return;}
      },{once:true});
    }
  }
  document.querySelectorAll('.ni').forEach(function(el){
    el.classList.toggle('active',el.getAttribute('data-p')===S.page);
  });
  var hb=document.getElementById('hbtn');
  if(hb){
    if(S.page==='catalog'||S.page==='purchases'){
      hb.style.display='block';
      hb.onclick=S.page==='catalog'?function(){openProductModal({});}:openPurchaseModal;
    }else{hb.style.display='none';}
  }
}

// ── Sell modal ────────────────────────────────────────────────────────────────
function openSellModal(productId){
  var p=S.products.find(function(x){return x.id===productId;});
  if(!p)return;
  var total=(p.locationStock||[]).reduce(function(s,l){return s+l.qty;},0);

  var today=new Date();
  var dateStr=String(today.getDate()).padStart(2,'0')+'.'+String(today.getMonth()+1).padStart(2,'0')+'.'+today.getFullYear();

  var backdrop=document.createElement('div');
  backdrop.className='modal-backdrop';

  var modal=document.createElement('div');
  modal.className='modal';

  // Build loc options
  var locOpts='';
  if(p.locationStock&&p.locationStock.length){
    p.locationStock.forEach(function(l){
      var opt=document.createElement('option');
      opt.value=l.loc;
      opt.textContent=l.loc+' ('+l.qty+' шт)';
      locOpts+=opt.outerHTML;
    });
  }else{
    locOpts='<option value="Instagram">Instagram</option><option value="Кафе About">Кафе About</option><option value="Другое">Другое</option>';
  }

  modal.innerHTML='<div class="mhandle"></div>'
    +'<div class="mtitle">Продать</div>'
    +'<div style="background:var(--gold-l);border-radius:10px;padding:12px;margin-bottom:16px">'
    +'<div style="font-weight:600;font-size:14px">'+esc(p.name)+'</div>'
    +'<div style="font-size:13px;margin-top:4px">Цена: '+fmt(p.price1)+' · В наличии: '+total+' шт</div>'
    +'</div>'
    +'<div class="frow">'
    +'<div class="fg"><label>Кол-во</label><input class="fi" type="number" id="s-qty" value="1" min="1" max="'+total+'"/></div>'
    +'<div class="fg"><label>Сумма (грн)</label><input class="fi" type="number" id="s-amt" value="'+p.price1+'"/></div>'
    +'</div>'
    +'<div class="fg"><label>Точка продажи</label><select class="fi" id="s-pt">'+locOpts+'</select></div>'
    +'<div class="fg"><label>Дата</label><input class="fi" id="s-dt" value="'+dateStr+'"/></div>'
    +'<div class="fg"><label>Примечание</label><input class="fi" id="s-nt" placeholder="Необязательно"/></div>'
    +'<div class="mact">'
    +'<button class="btn btn-out" id="s-cancel">Отмена</button>'
    +'<button class="btn btn-red" id="s-ok">✓ Продано!</button>'
    +'</div>';

  backdrop.appendChild(modal);
  document.body.appendChild(backdrop);

  backdrop.addEventListener('click',function(e){if(e.target===backdrop)backdrop.remove();});
  document.getElementById('s-cancel').addEventListener('click',function(){backdrop.remove();});
  document.getElementById('s-ok').addEventListener('click',function(){confirmSell(productId,backdrop);});
  document.getElementById('s-qty').addEventListener('input',function(){
    document.getElementById('s-amt').value=p.price1*(+this.value||1);
  });
}

function confirmSell(productId,backdrop){
  var p=S.products.find(function(x){return x.id===productId;});
  if(!p)return;
  var qty=+document.getElementById('s-qty').value||1;
  var amount=+document.getElementById('s-amt').value||0;
  var point=document.getElementById('s-pt').value;
  var date=document.getElementById('s-dt').value;
  var note=document.getElementById('s-nt').value.trim();

  // Parse month index
  var monthIdx=S.month;
  try{monthIdx=parseInt(date.split('.')[1])-1;}catch(e){}
  if(monthIdx<0||monthIdx>11)monthIdx=S.month;

  // Add sale
  S.sales.push({id:Date.now(),productId:productId,productName:p.name,qty:qty,amount:amount,point:point,date:date,monthIdx:monthIdx,note:note});

  // Update locationStock
  p.locationStock=(p.locationStock||[]).map(function(l){
    return l.loc===point?{loc:l.loc,qty:Math.max(0,l.qty-qty)}:l;
  });

  // Update finance
  if(S.finance[monthIdx]){
    if(point==='Кафе About')S.finance[monthIdx].incomeAbout=(S.finance[monthIdx].incomeAbout||0)+amount;
    else S.finance[monthIdx].incomeIG=(S.finance[monthIdx].incomeIG||0)+amount;
  }

  backdrop.remove();
  scheduleSave();
  render();
  toast('Продажа записана ✓ Финансы обновлены!');
}

function delSale(idx){
  if(!confirm('Удалить запись о продаже?'))return;
  var x=S.sales[idx];
  if(x){
    // Reverse finance
    if(S.finance[x.monthIdx]){
      if(x.point==='Кафе About')S.finance[x.monthIdx].incomeAbout=Math.max(0,(S.finance[x.monthIdx].incomeAbout||0)-x.amount);
      else S.finance[x.monthIdx].incomeIG=Math.max(0,(S.finance[x.monthIdx].incomeIG||0)-x.amount);
    }
    // Restore stock
    var prod=S.products.find(function(p){return p.id===x.productId;});
    if(prod){
      var found=false;
      prod.locationStock=(prod.locationStock||[]).map(function(l){
        if(l.loc===x.point){found=true;return{loc:l.loc,qty:l.qty+x.qty};}return l;
      });
      if(!found)prod.locationStock.push({loc:x.point,qty:x.qty});
    }
  }
  S.sales.splice(idx,1);
  scheduleSave();render();toast('Продажа удалена');
}

function updCalc(){
  var cost=S.calc.reduce(function(s,i){return s+i.qty*i.price;},0);
  var cv=document.getElementById('crv');if(cv)cv.textContent=cost.toFixed(0)+' грн';
  [[3,'po3'],[4,'po4'],[5,'po5']].forEach(function(m){
    var e=document.getElementById(m[1]);
    if(e)e.textContent=(cost*m[0]).toFixed(0)+' ₴';
  });
}

function addCalcItem(){
  var n=document.getElementById('ni-n').value.trim();
  var q=+document.getElementById('ni-q').value||1;
  var p=+document.getElementById('ni-p').value||0;
  if(!n)return;
  S.calc.push({name:n,qty:q,price:p});
  render();
}

function detectCategory(name) {
  var n = (name||'').toLowerCase();
  if(n.includes('браслет')) return 'браслет';
  if(n.includes('чокер')) return 'чокер';
  if(n.includes('колье') || n.includes('кольє')) return 'колье';
  if(n.includes('кольцо') || n.includes('кільце')) return 'кольцо';
  if(n.includes('серьг') || n.includes('сережк')) return 'серьги';
  if(n.includes('брошь') || n.includes('брош')) return 'брошь';
  if(n.includes('комплект')) return 'комплект';
  return 'другое';
}

function renderLocList(){
  var el=document.getElementById('lc-list');if(!el)return;
  el.innerHTML='';
  locItems.forEach(function(l,i){
    var row=document.createElement('div');
    row.style.cssText='display:flex;align-items:center;gap:8px';
    var chip=document.createElement('span');
    chip.className='lchip';chip.style.flex='1';chip.textContent='📍 '+l.loc;
    var inp=document.createElement('input');
    inp.type='number';inp.value=l.qty;
    inp.style.cssText='width:56px;padding:6px 8px;border:1.5px solid var(--border);border-radius:8px;font-size:13px;text-align:center;outline:none';
    inp.addEventListener('change',function(){locItems[i].qty=+this.value||0;});
    var del=document.createElement('button');
    del.className='bx';del.style.color='var(--red)';del.textContent='×';
    del.addEventListener('click',function(){locItems.splice(i,1);renderLocList();});
    row.appendChild(chip);row.appendChild(inp);
    row.appendChild(document.createTextNode('шт'));
    row.appendChild(del);
    el.appendChild(row);
  });
}

function addLoc(){
  var n=document.getElementById('lc-n').value.trim();
  var q=+document.getElementById('lc-q').value||1;
  if(!n||locItems.find(function(l){return l.loc===n;}))return;
  locItems.push({loc:n,qty:q});
  document.getElementById('lc-n').value='';
  document.getElementById('lc-q').value='1';
  renderLocList();
}

function quickLoc(v){
  if(!locItems.find(function(l){return l.loc===v;})){locItems.push({loc:v,qty:1});renderLocList();}
}

// ── AI fill ───────────────────────────────────────────────────────────────────
var aiImg=null;
function onAiFile(input){
  var file=input.files[0];if(!file)return;
  var reader=new FileReader();
  reader.onload=function(e){
    aiImg={data:e.target.result.split(',')[1],type:file.type};
    var w=document.getElementById('ai-pw');
    if(w)w.innerHTML='<img src="'+e.target.result+'" style="width:80px;height:80px;object-fit:cover;border-radius:10px;margin-bottom:6px"/>';
  };
  reader.readAsDataURL(file);
}

async function doAiFill(){
  var text=(document.getElementById('ai-text')||{}).value||'';
  if(!text&&!aiImg){alert('Добавь фото или описание');return;}
  var btn=document.getElementById('ai-btn');
  if(btn){btn.innerHTML='<div class="spin"></div> AI заполняет…';btn.disabled=true;}
  try{
    var content=[];
    if(aiImg)content.push({type:'image',source:{type:'base64',media_type:aiImg.type,data:aiImg.data}});
    content.push({type:'text',text:'Заполни карточку украшения. Верни ТОЛЬКО JSON без markdown:\n{"name":"","desc":"","material":"","price1":0,"comp2":"","price2":0,"comp3":"","price3":0,"stock":1,"status":"Активный","cost":0,"img":"💎"}\n\nИнформация: '+(text||'смотри на фото')});
    var res=await fetch('https://api.anthropic.com/v1/messages',{method:'POST',headers:{'Content-Type':'application/json','anthropic-version':'2023-06-01','anthropic-dangerous-direct-browser-access':'true'},body:JSON.stringify({model:'claude-sonnet-4-6',max_tokens:1000,messages:[{role:'user',content:content}]})});
    var data=await res.json();
    var raw=(data.content||[]).find(function(b){return b.type==='text';});
    if(raw){var parsed=JSON.parse(raw.text.replace(/```json?|```/g,'').trim());openProductModal(parsed);toast('AI заполнил карточку ✓');}
  }catch(e){alert('Ошибка AI: '+e.message);}
  if(btn){btn.innerHTML='✨ Заполнить через AI';btn.disabled=false;}
}
