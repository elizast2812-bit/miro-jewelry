<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
:root{
  --red:#C0392B;--red-p:#FDF1F0;
  --gold:#C9A96E;--gold-l:#F5EDD8;
  --dark:#1A1A1A;--mid:#4A4A4A;--muted:#8A8A8A;
  --border:#E8E0D8;--bg:#FAF8F5;--white:#FFF;
  --green:#27AE60;--green-p:#EAF7EE;
  --sb:env(safe-area-inset-bottom,0px);
}
html,body{min-height:100vh;background:var(--bg);font-family:'Inter',sans-serif;color:var(--dark)}
#app{display:flex;flex-direction:column;min-height:100vh}
/* Header */
.hdr{background:var(--dark);padding:14px 18px;display:flex;align-items:center;justify-content:space-between;flex-shrink:0}
.logo{font-family:'Cormorant Garamond',serif;font-size:22px;font-weight:700;color:#fff;letter-spacing:1px}
.logo-s{font-size:9px;color:var(--gold);letter-spacing:3px;text-transform:uppercase;margin-top:1px}
#sync{font-size:10px;color:#888}
/* Scroll */
.scroll{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;padding:16px 16px calc(72px + var(--sb))}
/* Bottom nav */
.bnav{position:fixed;bottom:0;left:0;right:0;background:var(--dark);display:flex;padding:6px 0 calc(6px + var(--sb));z-index:50;border-top:1px solid #2a2a2a}
.ni{flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;cursor:pointer;padding:3px 0}
.ni span:first-child{font-size:19px;line-height:1}
.ni span:last-child{font-size:10px;color:#666;font-weight:500}
.ni.active span:last-child{color:var(--gold)}
/* Desktop */
@media(min-width:768px){
  #app{flex-direction:row}
  .hdr{display:none}
  .bnav{position:fixed;left:0;top:0;bottom:0;width:200px;flex-direction:column;padding:0;border-top:none;border-right:1px solid #2a2a2a;justify-content:flex-start;overflow:hidden}
  .bnav::before{content:'miro';font-family:'Cormorant Garamond',serif;font-size:22px;font-weight:700;color:#fff;letter-spacing:1px;padding:24px 22px 2px;display:block}
  .bnav::after{content:'JEWELRY PLATFORM';font-size:9px;color:var(--gold);letter-spacing:3px;padding:0 22px 16px;display:block;border-bottom:1px solid #2a2a2a;margin-bottom:6px}
  .ni{flex:none;flex-direction:row;padding:12px 22px;gap:10px;justify-content:flex-start;border-left:3px solid transparent}
  .ni.active{background:#252525;border-left-color:var(--gold)}
  .ni span:first-child{font-size:16px}
  .ni span:last-child{font-size:13px;color:#888}
  .ni.active span:last-child{color:#fff}
  .scroll{margin-left:200px;padding:26px 30px 40px}
  .stats-grid{grid-template-columns:repeat(4,1fr)!important}
  .modal-backdrop{align-items:center}
  .modal{border-radius:16px;max-width:600px;margin:auto}
  #dsync{display:block!important}
}
/* Base */
.card{background:var(--white);border:1px solid var(--border);border-radius:14px;padding:16px;margin-bottom:14px}
.ctitle{font-size:11px;font-weight:600;color:var(--muted);letter-spacing:1px;text-transform:uppercase;margin-bottom:12px}
.stats-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:14px}
.stat{background:var(--white);border:1px solid var(--border);border-radius:14px;padding:14px}
.slabel{font-size:10px;color:var(--muted);text-transform:uppercase;letter-spacing:.5px;margin-bottom:6px}
.sval{font-family:'Cormorant Garamond',serif;font-size:26px;font-weight:700}
.ssub{font-size:10px;color:var(--green);margin-top:2px}
/* Buttons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;padding:10px 18px;border-radius:10px;font-size:13px;font-weight:600;cursor:pointer;border:none;font-family:'Inter',sans-serif;width:100%}
.btn-red{background:var(--red);color:#fff}
.btn-gold{background:var(--gold);color:#fff}
.btn-out{background:transparent;border:1.5px solid var(--border);color:var(--mid)}
.btn-sm{padding:6px 13px;font-size:12px;width:auto}
.bx{background:transparent;border:none;font-size:18px;cursor:pointer;color:var(--muted);padding:4px;line-height:1}
/* Forms */
.fg{margin-bottom:13px}
.fg label{display:block;font-size:11px;font-weight:600;color:var(--mid);margin-bottom:4px;text-transform:uppercase;letter-spacing:.5px}
.fi{width:100%;padding:11px 13px;border:1.5px solid var(--border);border-radius:10px;font-size:14px;color:var(--dark);background:var(--white);outline:none;font-family:'Inter',sans-serif;-webkit-appearance:none}
.fi:focus{border-color:var(--gold)}
.frow{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.fta{width:100%;padding:11px 13px;border:1.5px solid var(--border);border-radius:10px;font-size:14px;color:var(--dark);background:var(--white);outline:none;resize:vertical;font-family:'Inter',sans-serif;min-height:70px}
/* Product card */
.pc{background:var(--white);border:1px solid var(--border);border-radius:14px;padding:14px;margin-bottom:12px;display:flex;gap:12px}
.pi{width:52px;height:52px;border-radius:10px;background:var(--bg);border:1px solid var(--border);display:flex;align-items:center;justify-content:center;font-size:24px;flex-shrink:0}
.pinfo{flex:1;min-width:0}
.pname{font-weight:600;font-size:14px;margin-bottom:2px}
.pdesc{font-size:11px;color:var(--muted);margin-bottom:6px;line-height:1.4}
.pprices{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:6px}
.pchip{background:var(--bg);border:1px solid var(--border);border-radius:6px;padding:3px 8px;font-size:11px;font-weight:600}
/* Badges */
.badge{display:inline-flex;padding:3px 9px;border-radius:20px;font-size:11px;font-weight:600}
.b-hit{background:#FFF3CD;color:var(--red)}
.b-active{background:var(--green-p);color:var(--green)}
.b-archive{background:#F0F0F0;color:#888}
/* Purchase card */
.prc{background:var(--white);border:1px solid var(--border);border-radius:12px;padding:14px;margin-bottom:10px}
.prc-h{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:8px}
.prc-name{font-weight:600;font-size:14px}
.prc-meta{font-size:11px;color:var(--muted);margin-top:2px}
.prc-row{display:flex;justify-content:space-between;padding:6px 0;border-bottom:1px solid var(--border);font-size:13px}
.prc-row:last-child{border-bottom:none}
/* Finance */
.fr{display:flex;align-items:center;justify-content:space-between;padding:9px 0;border-bottom:1px solid var(--border)}
.fr:last-child{border-bottom:none}
.frl{font-size:13px;color:var(--mid)}
.fri{width:115px;padding:7px 9px;border:1.5px solid var(--border);border-radius:8px;font-size:13px;font-weight:600;text-align:right;outline:none;font-family:'Inter',sans-serif}
.fri:focus{border-color:var(--gold)}
.ftot{background:var(--dark);border-radius:12px;padding:14px 18px;display:flex;justify-content:space-between;align-items:center;margin-top:12px}
.ftl{font-size:12px;color:#999}
.ftv{font-family:'Cormorant Garamond',serif;font-size:22px;font-weight:700;color:var(--gold)}
.pb{background:var(--dark);border-radius:14px;padding:20px;text-align:center;margin-top:14px}
.pbl{font-size:11px;color:#888;text-transform:uppercase;letter-spacing:1px;margin-bottom:4px}
.pbv{font-family:'Cormorant Garamond',serif;font-size:38px;font-weight:700}
/* Month tabs */
.mtabs{display:flex;gap:6px;overflow-x:auto;padding-bottom:4px;margin-bottom:14px;-webkit-overflow-scrolling:touch}
.mtabs::-webkit-scrollbar{display:none}
.mt{flex-shrink:0;padding:7px 13px;border-radius:8px;font-size:12px;font-weight:600;cursor:pointer;border:1.5px solid var(--border);color:var(--mid);background:white}
.mt.active{background:var(--dark);color:white;border-color:var(--dark)}
/* Calc */
.ci{display:flex;align-items:center;gap:8px;padding:8px 0;border-bottom:1px solid var(--border)}
.cr{background:var(--dark);border-radius:14px;padding:20px;margin-top:14px}
.crl{font-size:11px;color:#888;text-transform:uppercase;letter-spacing:1px;margin-bottom:4px}
.crv{font-family:'Cormorant Garamond',serif;font-size:36px;font-weight:700;color:#fff;margin-bottom:16px}
.popts{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.popt{background:#252525;border-radius:10px;padding:13px 8px;text-align:center}
.pol{font-size:10px;color:#888;margin-bottom:4px}
.pop{font-size:17px;font-weight:700;color:var(--gold)}
.pob{font-size:10px;color:#555;margin-top:3px}
/* AI zone */
.aiz{border:2px dashed var(--gold);border-radius:12px;padding:18px;text-align:center;background:var(--gold-l);cursor:pointer;margin-bottom:12px}
/* Modal */
.modal-backdrop{position:fixed;inset:0;background:rgba(0,0,0,.55);z-index:200;display:flex;flex-direction:column;justify-content:flex-end}
.modal{background:var(--white);border-radius:20px 20px 0 0;padding:20px 20px calc(20px + var(--sb));max-height:90vh;overflow-y:auto;-webkit-overflow-scrolling:touch}
.mhandle{width:40px;height:4px;background:var(--border);border-radius:2px;margin:0 auto 16px}
.mtitle{font-family:'Cormorant Garamond',serif;font-size:22px;font-weight:700;margin-bottom:16px}
.mact{display:flex;gap:10px;margin-top:16px}
.mact .btn{flex:1}
/* Sell btn */
.sell-btn{background:var(--green);color:#fff;border:none;border-radius:8px;padding:5px 12px;font-size:11px;font-weight:600;cursor:pointer}
/* Loc chip */
.lchip{background:var(--gold-l);border:1px solid var(--gold);border-radius:6px;padding:2px 8px;font-size:11px;font-weight:600;color:#8B6914}
/* Toast */
.toast{position:fixed;top:20px;left:50%;transform:translateX(-50%);background:var(--dark);color:#fff;padding:10px 20px;border-radius:10px;font-size:13px;font-weight:600;z-index:300;opacity:0;transition:opacity .3s;pointer-events:none}
.toast.show{opacity:1}
.empty{text-align:center;padding:40px 20px;color:var(--muted)}
.shead{font-size:11px;font-weight:600;color:var(--muted);text-transform:uppercase;letter-spacing:1px;margin:14px 0 8px}
#dsync{display:none;padding:14px 22px;font-size:11px;color:#666;border-top:1px solid #2a2a2a;margin-top:auto}
@keyframes spin{to{transform:rotate(360deg)}}
.spin{width:15px;height:15px;border:2px solid rgba(255,255,255,.3);border-top-color:#fff;border-radius:50%;animation:spin .8s linear infinite}
</style>
</head>

function dateToISO(d){
  // Converts dd.mm.yyyy to yyyy-mm-dd
  if(!d)return '';
  var p=d.split('.');
  if(p.length===3)return p[2]+'-'+p[1].padStart(2,'0')+'-'+p[0].padStart(2,'0');
  return d; // already ISO or unknown
}

function inCustomRange(dateStr,from,to){
  if(!from||!to)return true;
  var iso=dateToISO(dateStr);
  return iso>=from&&iso<=to;
}

}

}

// ── Load & validate ───────────────────────────────────────────────────────────
function validate(s){
  if(!s||typeof s!=='object')return JSON.parse(JSON.stringify(DEF));
  var pages=['dashboard','catalog','sales','calc','purchases','finance'];
  if(pages.indexOf(s.page)===-1)s.page='dashboard';
  if(!Array.isArray(s.products))s.products=JSON.parse(JSON.stringify(PRODUCTS_DEFAULT));
  if(!Array.isArray(s.purchases))s.purchases=[];
  if(!Array.isArray(s.sales))s.sales=[];
  if(!s.filter)s.filter='all';
  if(typeof s.pmonth!=='number')s.pmonth=7;
  if(typeof s.year!=='number')s.year=2026;
  if(typeof s.purchYear!=='number')s.purchYear=2026;
  if(!s.financeByYear||typeof s.financeByYear!=='object')s.financeByYear={};
  if(!s.financeByYear['2026'])s.financeByYear['2026']=s.finance||makeFinance();
  if(!s.financeByYear[String(s.year)])s.financeByYear[String(s.year)]=makeFinance();
  if(!s.marketing)s.marketing={instagramUrl:'',mission:'',audience:'',tone:'',brandColors:['#C0392B','#C9A96E','#1A1A1A'],brandFonts:'',logoUrl:'',packagingDesc:'',photoshoots:[],competitors:[]};
  if(!Array.isArray(s.marketing.photoshoots))s.marketing.photoshoots=[];
  if(!s.scripts)s.scripts=JSON.parse(JSON.stringify(DEFAULT_SCRIPTS));
  if(!s.scriptsCat)s.scriptsCat='';
  if(!Array.isArray(s.dismissedRestock))s.dismissedRestock=[];
  if(!s.dashMode)s.dashMode='month';
  if(typeof s.dashYear!=='number')s.dashYear=new Date().getFullYear();
  if(typeof s.dashMonth!=='number')s.dashMonth=new Date().getMonth();
  if(!s.dashFrom)s.dashFrom='';
  if(!s.dashTo)s.dashTo='';
  if(!s.finMode)s.finMode='month';
  if(!s.finFrom)s.finFrom='';
  if(!s.finTo)s.finTo='';
  if(!s.purchMode)s.purchMode='month';
  if(!s.purchFrom)s.purchFrom='';
  if(!s.purchTo)s.purchTo='';
  if(!Array.isArray(s.calc))s.calc=JSON.parse(JSON.stringify(DEF.calc));
  if(!Array.isArray(s.finance)||s.finance.length<12)s.finance=makeFinance();
  if(typeof s.month!=='number'||s.month<0||s.month>11)s.month=7;
  s.finance=MO.map(function(m,i){return Object.assign({},makeFinance()[i],s.finance[i]||{});});
  return s;
}

function esc(s){return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');}

        if(pm){S.pmonth=+pm.getAttribute('data-pmonth');render();return;}
        var dp=e.target.closest('[data-delpurch]');
        if(dp&&confirm('Видалити закупку?')){
          var pid=+dp.getAttribute('data-delpurch');
          // Reverse expense
          var x=S.purchases.find(function(p){return p.id===pid;});
          if(x){var dFin=getFinance(x.year||2026);if(dFin&&dFin[x.monthIdx])dFin[x.monthIdx].expMaterials=Math.max(0,(dFin[x.monthIdx].expMaterials||0)-x.amount);}
          S.purchases=S.purchases.filter(function(p){return p.id!==pid;});
          scheduleSave();render();toast('Закупку видалено');return;}
      },{once:true});
    }
  }
  // Dashboard delegation
  if(S.page==='dashboard'){
    var dArea=document.getElementById('area');
    if(dArea){
      dArea.addEventListener('click',function(e){
        var dm=e.target.closest('[data-dashmode]');
        if(dm){S.dashMode=dm.getAttribute('data-dashmode');render();return;}
        var dy=e.target.closest('[data-dashyear]');
        if(dy){S.dashYear=+dy.getAttribute('data-dashyear');render();return;}
        var dmn=e.target.closest('[data-dashmonth]');
        if(dmn){S.dashMonth=+dmn.getAttribute('data-dashmonth');render();return;}
      },{once:true});
      // Apply button for custom period
      var applyBtn=document.getElementById('dash-apply');
      if(applyBtn){
        applyBtn.addEventListener('click',function(){
          var f=document.getElementById('dash-from');
          var t=document.getElementById('dash-to');
          if(f&&t){
            S.dashFrom=f.value;
            S.dashTo=t.value;
            render();
          }
        });
      }
    }
  }
  // Marketing page delegation
  if(S.page==='marketing'){
    var mArea=document.getElementById('area');
    if(mArea){
      var addPsBtn=document.getElementById('add-ps-btn');
      if(addPsBtn)addPsBtn.addEventListener('click',function(){openPhotoshootModal();});
      mArea.addEventListener('click',function(e){
        var dp=e.target.closest('[data-delps]');
        if(dp){var idx=+dp.getAttribute('data-delps');if(confirm('Видалити фотосесію?')){S.marketing.photoshoots.splice(idx,1);scheduleSave();render();toast('Видалено');}return;}
      },{once:true});
    }
  }
  // Scripts page delegation
  if(S.page==='scripts'){
    var sArea=document.getElementById('area');
    if(sArea){
      var addSBtn=document.getElementById('add-script-btn');
      if(addSBtn)addSBtn.addEventListener('click',function(){openScriptModal(null);});
      sArea.addEventListener('click',function(e){
        var sc=e.target.closest('[data-scat]');
        if(sc){S.scriptsCat=sc.getAttribute('data-scat');render();return;}
        var edit=e.target.closest('[data-editscript]');
        if(edit){openScriptModal(+edit.getAttribute('data-editscript'));return;}
        var copy=e.target.closest('[data-copyscript]');
        if(copy){
          var s=(S.scripts||[]).find(function(x){return x.id===+copy.getAttribute('data-copyscript');});
          if(s){navigator.clipboard.writeText(s.text).then(function(){toast('Скопійовано в буфер 📋');}).catch(function(){toast('Текст скрипту: '+s.text.slice(0,50)+'...');});}
          return;
        }
      },{once:true});
    }
  }
  // Finance delegation
  if(S.page==='finance'){
    var farea=document.getElementById('area');
    if(farea){
      var finApply=document.getElementById('fin-apply');
      if(finApply){finApply.addEventListener('click',function(){var f=document.getElementById('fin-from');var t=document.getElementById('fin-to');if(f&&t){S.finFrom=f.value;S.finTo=t.value;render();}});}
      farea.addEventListener('click',function(e){
        var fm0=e.target.closest('[data-finmode]');
        if(fm0){S.finMode=fm0.getAttribute('data-finmode');render();return;}
        var fy=e.target.closest('[data-fyear]');
        if(fy){S.year=+fy.getAttribute('data-fyear');if(!S.financeByYear[String(S.year)])S.financeByYear[String(S.year)]=makeFinance();render();return;}
        var fm2=e.target.closest('[data-fmonth]');
        if(fm2){S.month=+fm2.getAttribute('data-fmonth');render();return;}
      },{once:true});
    }
  }
  // Catalog button delegation
  if(S.page==='catalog'){
    var area2=document.getElementById('area');
    if(area2){
      area2.addEventListener('click',function(e){
        // Filter tab
        var cat=e.target.closest('[data-cat]');
        if(cat){S.filter=cat.getAttribute('data-cat');render();return;}
        // Toggle card expand
        var tc=e.target.closest('[data-togglecat]');
        if(tc&&!e.target.closest('button')&&!e.target.closest('input')){
          var el=document.getElementById('cat-card-'+tc.getAttribute('data-togglecat'));
          if(el)el.style.display=el.style.display==='none'?'block':'none';
          return;
        }
        // Edit
        var edit=e.target.closest('[data-edit]');
        if(edit){var p=S.products.find(function(x){return x.id===+edit.getAttribute('data-edit');});if(p)openProductModal(p);return;}
        // Delete
        var del=e.target.closest('[data-del]');
        if(del&&confirm('Видалити товар?')){S.products=S.products.filter(function(x){return x.id!==+del.getAttribute('data-del');});scheduleSave();render();toast('Товар видалено');return;}
        // Sell
        var sell=e.target.closest('.sell-btn');
        if(sell){openSellModal(+sell.getAttribute('data-pid'));return;}
        // Add location price
        var addlp=e.target.closest('[data-addlp]');
        if(addlp){
          var pid=+addlp.getAttribute('data-addlp');
          var locEl=document.getElementById('lp-loc-'+pid);
          var priceEl=document.getElementById('lp-price-'+pid);
          if(locEl&&priceEl&&locEl.value.trim()&&priceEl.value){
            var prod=S.products.find(function(x){return x.id===pid;});
            if(prod){
              if(!prod.locationPrices)prod.locationPrices=[];
              // Update if exists, add if new
              var existing=prod.locationPrices.find(function(lp){return lp.loc===locEl.value.trim();});
              if(existing){existing.price=+priceEl.value;}
              else{prod.locationPrices.push({loc:locEl.value.trim(),price:+priceEl.value});}
              scheduleSave();render();toast('Ціну для точки збережено ✓');
            }
          }
          return;
        }
        // Delete location price
        var dellp=e.target.closest('[data-dellp]');
        if(dellp){
          var pid=+dellp.getAttribute('data-dellp');
          var lpIdx=+dellp.getAttribute('data-lpidx');
          var prod=S.products.find(function(x){return x.id===pid;});
          if(prod&&prod.locationPrices){prod.locationPrices.splice(lpIdx,1);scheduleSave();render();}
          return;
        }
      },{once:true});
    }
  }
  document.querySelectorAll('.ni').forEach(function(el){
    el.classList.toggle('active',el.getAttribute('data-p')===S.page);
  });
  var hb=document.getElementById('hbtn');
  if(hb){
    if(S.page==='catalog'||S.page==='purchases'){
      hb.style.display='block';
      hb.onclick=S.page==='catalog'?function(){openProductModal({});}:openPurchaseModal;
    }else{hb.style.display='none';}
  }
}

// ── Page title helper ─────────────────────────────────────────────────────────
function ptitle(t,s){
  return '<div style="font-family:\'Cormorant Garamond\',serif;font-size:26px;font-weight:700;margin-bottom:2px">'+t+'</div>'
    +'<div style="font-size:12px;color:var(--muted);margin-bottom:16px">'+s+'</div>';
}

// ── Dashboard ─────────────────────────────────────────────────────────────────
function pgDash(){
  // ── Date filter ──────────────────────────────────────────────────────────
  if(!S.dashMode)S.dashMode='month'; // 'month' | 'year' | 'custom'
  if(typeof S.dashYear!=='number')S.dashYear=new Date().getFullYear();
  if(typeof S.dashMonth!=='number')S.dashMonth=new Date().getMonth();
  if(!S.dashFrom)S.dashFrom='';
  if(!S.dashTo)S.dashTo='';

  // ── Filter sales by selected period ─────────────────────────────────────
  function salesInPeriod(){
    return S.sales.filter(function(s){
      if(S.dashMode==='month') return s.monthIdx===S.dashMonth&&(s.year||2026)===S.dashYear;
      if(S.dashMode==='year')  return (s.year||2026)===S.dashYear;
      if(S.dashMode==='custom') return inCustomRange(s.date,S.dashFrom,S.dashTo);
      return true;
    });
  }

  function purchInPeriod(){
    return S.purchases.filter(function(p){
      if(S.dashMode==='month') return p.monthIdx===S.dashMonth&&(p.year||2026)===S.dashYear;
      if(S.dashMode==='year')  return (p.year||2026)===S.dashYear;
      if(S.dashMode==='custom') return inCustomRange(p.date,S.dashFrom,S.dashTo);
      return true;
    });
  }

  function finInPeriod(){
    var result=[];
    if(S.dashMode==='month'){
      result=[getFinance(S.dashYear)[S.dashMonth]||{}];
    } else if(S.dashMode==='year'){
      result=getFinance(S.dashYear);
    } else if(S.dashMode==='custom'&&S.dashFrom&&S.dashTo){
      // For custom: collect all months within date range
      YEARS.forEach(function(y){
        var yf=getFinance(y);
        MO.forEach(function(mn,mi){
          // Check if any day of this month falls in range
          var monthStart=y+'-'+String(mi+1).padStart(2,'0')+'-01';
          var monthEnd=y+'-'+String(mi+1).padStart(2,'0')+'-31';
          if(monthStart<=S.dashTo&&monthEnd>=S.dashFrom)result.push(yf[mi]||{});
        });
      });
    } else {
      result=getFinance(S.dashYear);
    }
    return result.filter(Boolean);
  }

  var filteredSales=salesInPeriod();
  var filteredPurch=purchInPeriod();
  var finMonths=finInPeriod();

  // ── Key metrics ──────────────────────────────────────────────────────────
  var totalRevenue=filteredSales.reduce(function(s,x){return s+(x.amount||0);},0);
  var totalSalesCount=filteredSales.length;
  var avgCheck=totalSalesCount>0?Math.round(totalRevenue/totalSalesCount):0;
  var totalMargin=filteredSales.reduce(function(s,x){return s+(x.margin!=null?x.margin:0);},0);
  var marginPct=totalRevenue>0?Math.round(totalMargin/totalRevenue*100):0;

  var totalIncome=finMonths.reduce(function(s,m){return s+(m.incomeIG||0)+(m.incomeAbout||0)+(m.incomeOther||0);},0);
  var totalExpenses=finMonths.reduce(function(s,m){return s+(m.expSalary||0)+(m.expTeam||0)+(m.expMaterials||0)+(m.expFurniture||0)+(m.expPackaging||0)+(m.expDeliveryIn||0)+(m.expAds||0)+(m.expSmm||0)+(m.expPhoto||0)+(m.expStudio||0)+(m.expDeliveryOut||0)+(m.expOther||0);},0);
  var netProfit=totalIncome-totalExpenses;
  var profitability=totalIncome>0?Math.round(netProfit/totalIncome*100):0;

  var activeProducts=S.products.filter(function(p){return p.status!=='Архів';}).length;

  // ── Period label ─────────────────────────────────────────────────────────
  var periodLabel=S.dashMode==='month'?MO[S.dashMonth]+' '+S.dashYear
    :S.dashMode==='year'?S.dashYear+' рік'
    :(S.dashFrom&&S.dashTo?S.dashFrom+' — '+S.dashTo:'Обраний період');

  // ── Period selector ──────────────────────────────────────────────────────
  var modeBar=['month','year','custom'].map(function(m){
    var labels={month:'Місяць',year:'Рік',custom:'Свій період'};
    var act=S.dashMode===m;
    return '<button data-dashmode="'+m+'" style="padding:6px 14px;border-radius:8px;font-size:12px;font-weight:600;cursor:pointer;border:1.5px solid '+(act?'var(--dark)':'var(--border)')+';background:'+(act?'var(--dark)':'white')+';color:'+(act?'#fff':'var(--mid)')+'">'+labels[m]+'</button>';
  }).join('');

  var yearSelector=YEARS.map(function(y){
    var act=y===S.dashYear;
    return '<button data-dashyear="'+y+'" style="padding:5px 12px;border-radius:8px;font-size:12px;font-weight:600;cursor:pointer;border:1.5px solid '+(act?'var(--dark)':'var(--border)')+';background:'+(act?'var(--dark)':'white')+';color:'+(act?'#fff':'var(--mid)')+'">'+y+'</button>';
  }).join('');

  var monthSelector=S.dashMode==='month'?'<div class="mtabs" style="margin-top:8px">'+MO.map(function(m,i){
    var act=i===S.dashMonth;
    return '<button data-dashmonth="'+i+'" class="mt'+(act?' active':'')+'" style="font-size:11px">'+m.slice(0,3)+'</button>';
  }).join('')+'</div>':'';

  var customPicker=S.dashMode==='custom'?'<div style="margin-top:10px">'
    +'<div style="display:flex;gap:10px;align-items:center;margin-bottom:8px">'
    +'<input type="date" id="dash-from" value="'+S.dashFrom+'" class="fi" style="flex:1;padding:8px 10px;font-size:13px"/>'
    +'<span style="color:var(--muted);font-size:13px">—</span>'
    +'<input type="date" id="dash-to" value="'+S.dashTo+'" class="fi" style="flex:1;padding:8px 10px;font-size:13px"/>'
    +'</div>'
    +'<button id="dash-apply" style="width:100%;padding:10px;background:var(--dark);color:#fff;border:none;border-radius:10px;font-size:13px;font-weight:600;cursor:pointer;font-family:Inter,sans-serif">🔍 Застосувати</button>'
    +'</div>':'';

  // ── Expense breakdown for expandable ────────────────────────────────────
  var expBreakdown=[
    {label:'Зарплата (своя)',key:'expSalary'},
    {label:'Команда',key:'expTeam'},
    {label:'Матеріали',key:'expMaterials'},
    {label:'Фурнітура',key:'expFurniture'},
    {label:'Пакування',key:'expPackaging'},
    {label:'Доставка матеріалів',key:'expDeliveryIn'},
    {label:'Реклама / трафік',key:'expAds'},
    {label:'SMM',key:'expSmm'},
    {label:'Фотограф',key:'expPhoto'},
    {label:'Студія',key:'expStudio'},
    {label:'Доставка клієнтам',key:'expDeliveryOut'},
    {label:'Інше',key:'expOther'},
  ].map(function(e){
    var val=finMonths.reduce(function(s,m){return s+(m[e.key]||0);},0);
    return val>0?'<div class="fr"><span class="frl">'+e.label+'</span><span style="font-weight:600">'+fmt(val)+'</span></div>':'';
  }).filter(Boolean).join('');

  var incomeBreakdown='<div class="fr"><span class="frl">Instagram</span><span style="font-weight:600">'+fmt(finMonths.reduce(function(s,m){return s+(m.incomeIG||0);},0))+'</span></div>'
    +'<div class="fr"><span class="frl">Кафе About</span><span style="font-weight:600">'+fmt(finMonths.reduce(function(s,m){return s+(m.incomeAbout||0);},0))+'</span></div>'
    +'<div class="fr"><span class="frl">Інше</span><span style="font-weight:600">'+fmt(finMonths.reduce(function(s,m){return s+(m.incomeOther||0);},0))+'</span></div>';

  // ── Metric card helper ───────────────────────────────────────────────────
  function mcard(icon,label,value,sub,expandId,expandHtml){
    var hasExp=expandId&&expandHtml;
    return '<div class="stat" style="cursor:'+(hasExp?'pointer':'default')+';position:relative" '+(hasExp?'data-expand="'+expandId+'"':'')+' onclick="'+(hasExp?'toggleExpand(\''+expandId+'\')':'')+'">'
      +'<div class="slabel">'+icon+' '+label+(hasExp?' <span style="font-size:10px;color:var(--muted)">▼</span>':'')+'</div>'
      +'<div class="sval" style="font-size:22px">'+value+'</div>'
      +(sub?'<div class="ssub">'+sub+'</div>':'')
      +(hasExp?'<div id="'+expandId+'" style="display:none;margin-top:10px;padding-top:10px;border-top:1px solid var(--border);text-align:left">'+expandHtml+'</div>':'')
      +'</div>';
  }

  return '<div>'
    // Title + period selector
    +'<div style="font-family:\'Cormorant Garamond\',serif;font-size:26px;font-weight:700;margin-bottom:4px">Дашборд</div>'
    +'<div style="font-size:12px;color:var(--muted);margin-bottom:14px">'+periodLabel+'</div>'

    // Mode bar
    +'<div style="display:flex;gap:6px;margin-bottom:8px">'+modeBar+'</div>'
    +'<div style="display:flex;gap:6px;flex-wrap:wrap;margin-bottom:4px">'+yearSelector+'</div>'
    +monthSelector
    +customPicker
    +'<div style="height:16px"></div>'

    // Row 1: товари і продажі
    +'<div class="stats-grid" style="grid-template-columns:1fr 1fr;margin-bottom:10px">'
    +mcard('💎','Товарів в каталозі',activeProducts,'активних: '+S.products.length,'','')
    +mcard('🛍️','Продажів',totalSalesCount,totalSalesCount>0?'на суму '+fmt(totalRevenue):'','','')
    +'</div>'

    // Row 2: фінанси
    +'<div class="stats-grid" style="grid-template-columns:1fr 1fr;margin-bottom:10px">'
    +mcard('💚','Дохід',fmtN(totalIncome)+' грн','','exp-income',incomeBreakdown)
    +mcard('🔴','Витрати',fmtN(totalExpenses)+' грн','','exp-expenses',expBreakdown)
    +'</div>'

    // Row 3: прибуток і рентабельність
    +'<div class="stats-grid" style="grid-template-columns:1fr 1fr;margin-bottom:10px">'
    +mcard('📊','Чистий прибуток',fmtN(netProfit)+' грн',(netProfit>=0?'▲ плюс':'▼ мінус'),'','')
    +mcard('📈','Рентабельність',profitability+'%','прибуток / дохід × 100','','')
    +'</div>'

    // Row 4: середній чек і маржа
    +'<div class="stats-grid" style="grid-template-columns:1fr 1fr;margin-bottom:10px">'
    +mcard('🧾','Середній чек',avgCheck?fmt(avgCheck):'—','за продаж','','')
    +mcard('💹','Маржинальність',marginPct+'%','маржа / виручка × 100','exp-margin',
      filteredSales.filter(function(x){return x.margin!=null;}).slice(-5).reverse().map(function(x){
        return '<div class="fr"><span style="font-size:12px;max-width:120px;overflow:hidden;text-overflow:ellipsis">'+esc(x.productName)+'</span><span style="font-size:12px;font-weight:600;color:'+(x.margin>=0?'var(--green)':'var(--red)')+'">'+Math.round(x.margin/(x.amount||1)*100)+'%</span></div>';
      }).join('')||'<div style="font-size:12px;color:var(--muted)">Немає даних</div>')
    +'</div>'

    +'</div>';
}

function toggleExpand(id){
  var el=document.getElementById(id);
  if(el)el.style.display=el.style.display==='none'?'block':'none';
}


function locStockHtml(ls){
  if(!ls||!ls.length)return '';
  return '<div style="margin-top:8px;padding-top:8px;border-top:1px solid var(--border)">'
    +ls.map(function(l){return '<div style="display:flex;justify-content:space-between;padding:3px 0"><span class="lchip">📍 '+esc(l.loc)+'</span><span style="font-size:12px;font-weight:600">'+l.qty+' шт</span></div>';}).join('')
    +'</div>';
}

// ── Catalog ───────────────────────────────────────────────────────────────────
function pgCatalog(){
  if(!S.filter)S.filter='all';
  var filtered=S.filter==='all'?S.products:S.products.filter(function(p){return detectCategory(p.name)===S.filter;});

  // Filter tabs
  var visibleCats=CATS.filter(function(c){
    if(c==='all')return true;
    return S.products.some(function(p){return detectCategory(p.name)===c;});
  });
  var filterTabsHtml=visibleCats.map(function(c){
    var act=S.filter===c;
    return '<button data-cat="'+c+'" style="flex-shrink:0;padding:6px 12px;border-radius:8px;font-size:12px;font-weight:600;cursor:pointer;border:1.5px solid '+(act?'var(--dark)':'var(--border)')+';background:'+(act?'var(--dark)':'white')+';color:'+(act?'#fff':'var(--mid)')+'">'+CAT_LABELS[c]+'</button>';
  }).join('');

  var cards=filtered.map(function(p){
    var bc=p.status==='Хіт'||p.status==='Хит'?'b-hit':p.status==='Архів'||p.status==='Архив'?'b-archive':'b-active';
    var bt=p.status==='Хіт'||p.status==='Хит'?'🔥 Хіт':esc(p.status||'Активний');
    var total=(p.locationStock||[]).reduce(function(s,l){return s+l.qty;},0);

    // Build prices including location-specific prices
    var prices='<span class="pchip">'+fmt(p.price1)+'</span>'
      +(p.comp2?'<span class="pchip" style="font-size:10px">'+esc(p.comp2)+': '+fmt(p.price2)+'</span>':'')
      +(p.comp3?'<span class="pchip" style="font-size:10px">'+esc(p.comp3)+': '+fmt(p.price3)+'</span>':'');

    // Location prices
    var locPrices=(p.locationPrices||[]).map(function(lp){
      return '<span class="pchip" style="font-size:10px;background:var(--gold-l);border-color:var(--gold)">'+esc(lp.loc)+': '+fmt(lp.price)+'</span>';
    }).join('');

    // Sell button - uses location price if available
    var sellBtn=total>0
      ?'<button class="sell-btn" data-pid="'+p.id+'">+ Продати</button>'
      :'<span style="font-size:11px;color:var(--red)">Немає в наявності</span>';

    // Meta info
    var meta='';
    if(p.material)meta+=esc(p.material);
    if(p.fittings)meta+=(meta?' · ':'')+esc(p.fittings)+(p.fittingsColor?' ('+esc(p.fittingsColor)+')':'');
    if(p.size)meta+=(meta?' · ':'')+'📏 '+esc(p.size);

    // Collapsed card header
    var header='<div style="display:flex;gap:12px;align-items:flex-start">'
      +(p.photo?'<div class="pi" style="overflow:hidden;flex-shrink:0"><img src="'+p.photo+'" style="width:100%;height:100%;object-fit:cover;border-radius:10px"/></div>':'<div class="pi" style="flex-shrink:0">'+esc(p.img||'💎')+'</div>')
      +'<div style="flex:1;min-width:0">'
      +'<div style="display:flex;justify-content:space-between;align-items:flex-start;gap:6px">'
      +'<div class="pname">'+esc(p.name)+'</div>'
      +'<div style="display:flex;gap:4px;flex-shrink:0">'
      +'<button class="bx" data-edit="'+p.id+'">✏️</button>'
      +'<button class="bx" data-del="'+p.id+'" style="color:var(--red)">🗑️</button>'
      +'</div></div>'
      +(meta?'<div class="pdesc">'+meta+'</div>':'')
      +'<div class="pprices">'+prices+locPrices+'</div>'
      +'<div style="display:flex;align-items:center;flex-wrap:wrap;gap:6px;margin-top:4px">'
      +'<span class="badge '+bc+'">'+bt+'</span>'
      +'<span style="font-size:11px;color:var(--muted)">'+total+' шт</span>'
      +sellBtn
      +'</div>'
      +locStockHtml(p.locationStock)

    +(S.sales.length?rows:'<div class="empty"><div style="font-size:36px;margin-bottom:10px">🛍️</div><div>Ще немає продажів<br><small>Натисни кнопку "+ Продати" в Каталоге</small></div></div>')

// ── Sell modal ────────────────────────────────────────────────────────────────
function openSellModal(productId){
  var p=S.products.find(function(x){return x.id===productId;});
  if(!p)return;
  var total=(p.locationStock||[]).reduce(function(s,l){return s+l.qty;},0);

  var today=new Date();
  var dateStr=String(today.getDate()).padStart(2,'0')+'.'+String(today.getMonth()+1).padStart(2,'0')+'.'+today.getFullYear();

  var backdrop=document.createElement('div');
  backdrop.className='modal-backdrop';

  var modal=document.createElement('div');
  modal.className='modal';

  // Build loc options
  var locOpts='';
  if(p.locationStock&&p.locationStock.length){
    p.locationStock.forEach(function(l){
      var locPrice=(p.locationPrices||[]).find(function(lp){return lp.loc===l.loc;});
      var price=locPrice?locPrice.price:p.price1;
      var opt=document.createElement('option');
      opt.value=l.loc;
      opt.setAttribute('data-price',price);
      opt.textContent=l.loc+' ('+l.qty+' шт) — '+price+' грн';
      locOpts+=opt.outerHTML;
    });
  }else{
    var opt1=document.createElement('option');
    opt1.value='Instagram';opt1.setAttribute('data-price',p.price1);opt1.textContent='Instagram — '+p.price1+' грн';
    var opt2=document.createElement('option');
    opt2.value='Кафе About';
    var cafePrice=(p.locationPrices||[]).find(function(lp){return lp.loc==='Кафе About';});
    opt2.setAttribute('data-price',cafePrice?cafePrice.price:p.price1);
    opt2.textContent='Кафе About — '+(cafePrice?cafePrice.price:p.price1)+' грн';
    locOpts=opt1.outerHTML+opt2.outerHTML;
  }

  modal.innerHTML='<div class="mhandle"></div>'
    +'<div class="mtitle">Продати</div>'
    +'<div style="background:var(--gold-l);border-radius:10px;padding:12px;margin-bottom:16px">'
    +'<div style="font-weight:600;font-size:14px">'+esc(p.name)+'</div>'
    +'<div style="font-size:13px;margin-top:4px">Цена: '+fmt(p.price1)+' · В наличии: '+total+' шт</div>'
    +'</div>'
    +'<div class="frow">'
    +'<div class="fg"><label>Кол-во</label><input class="fi" type="number" id="s-qty" value="1" min="1" max="'+total+'"/></div>'
    +'<div class="fg"><label>Сума (грн)</label><input class="fi" type="number" id="s-amt" value="'+p.price1+'"/></div>'
    +'</div>'
    +'<div class="fg"><label>Точка продажу</label><select class="fi" id="s-pt">'+locOpts+'</select></div>'
    +'<div class="fg"><label>Дата</label><input class="fi" id="s-dt" value="'+dateStr+'"/></div>'
    +'<div class="fg"><label>Примітка</label><input class="fi" id="s-nt" placeholder="Необов\'язково"/></div>'
    +'<div class="mact">'
    +'<button class="btn btn-out" id="s-cancel">Скасувати</button>'
    +'<button class="btn btn-red" id="s-ok">✓ Продано!</button>'
    +'</div>';

  backdrop.appendChild(modal);
  document.body.appendChild(backdrop);

  backdrop.addEventListener('click',function(e){if(e.target===backdrop)backdrop.remove();});
  document.getElementById('s-cancel').addEventListener('click',function(){backdrop.remove();});
  document.getElementById('s-ok').addEventListener('click',function(){confirmSell(productId,backdrop);});
  function getLocPrice(){
    var sel=document.getElementById('s-pt');
    if(!sel)return p.price1;
    var opt=sel.options[sel.selectedIndex];
    return opt?+(opt.getAttribute('data-price')||p.price1):p.price1;
  }
  document.getElementById('s-qty').addEventListener('input',function(){
    document.getElementById('s-amt').value=getLocPrice()*(+this.value||1);
  });
  document.getElementById('s-pt').addEventListener('change',function(){
    var qty=+document.getElementById('s-qty').value||1;
    document.getElementById('s-amt').value=getLocPrice()*qty;
  });
  // Set initial amount based on location
  var initPrice=getLocPrice();
  document.getElementById('s-amt').value=initPrice;
}

function confirmSell(productId,backdrop){
  var p=S.products.find(function(x){return x.id===productId;});
  if(!p)return;
  var qty=+document.getElementById('s-qty').value||1;
  var amount=+document.getElementById('s-amt').value||0;
  var point=document.getElementById('s-pt').value;
  var date=document.getElementById('s-dt').value;
  var note=document.getElementById('s-nt').value.trim();

  // Parse month index
  var monthIdx=S.month;
  try{monthIdx=parseInt(date.split('.')[1])-1;}catch(e){}
  if(monthIdx<0||monthIdx>11)monthIdx=S.month;

  // Add sale
  var margin=p.cost?(amount-(p.cost*qty)):null;
  var saleYear=S.purchYear||new Date().getFullYear();
  try{saleYear=parseInt(date.split('.')[2])||saleYear;}catch(e){}
  S.sales.push({id:Date.now(),productId:productId,productName:p.name,qty:qty,amount:amount,cost:p.cost||0,margin:margin,point:point,date:date,monthIdx:monthIdx,year:saleYear,note:note});

  // Update locationStock
  p.locationStock=(p.locationStock||[]).map(function(l){
    return l.loc===point?{loc:l.loc,qty:Math.max(0,l.qty-qty)}:l;
  });

  // Update finance via financeByYear
  var sellFin=getFinance(saleYear);
  if(sellFin&&sellFin[monthIdx]){
    if(point==='Кафе About')sellFin[monthIdx].incomeAbout=(sellFin[monthIdx].incomeAbout||0)+amount;
    else sellFin[monthIdx].incomeIG=(sellFin[monthIdx].incomeIG||0)+amount;
  }

  backdrop.remove();
  scheduleSave();
  render();
  toast('Продаж записано ✓ Фінанси оновлено!');
}

function delSale(idx){
  if(!confirm('Видалити запись о продаже?'))return;
  var x=S.sales[idx];
  if(x){
    // Reverse finance - use financeByYear
    var xFin=getFinance(x.year||2026);
    if(xFin&&xFin[x.monthIdx]){
      if(x.point==='Кафе About')xFin[x.monthIdx].incomeAbout=Math.max(0,(xFin[x.monthIdx].incomeAbout||0)-x.amount);
      else xFin[x.monthIdx].incomeIG=Math.max(0,(xFin[x.monthIdx].incomeIG||0)-x.amount);
    }
    // Restore stock
    var prod=S.products.find(function(p){return p.id===x.productId;});
    if(prod){
      var found=false;
      prod.locationStock=(prod.locationStock||[]).map(function(l){
        if(l.loc===x.point){found=true;return{loc:l.loc,qty:l.qty+x.qty};}return l;
      });
      if(!found)prod.locationStock.push({loc:x.point,qty:x.qty});
    }
  }
  S.sales.splice(idx,1);
  scheduleSave();render();toast('Продаж видалено');
}

// ── Calc ──────────────────────────────────────────────────────────────────────
function pgCalc(){
  if(!S.calc||!Array.isArray(S.calc))S.calc=[{name:'Тросик ювелірний',qty:40,unit:'см',pricePerUnit:0.01,totalPrice:0.40},{name:'Замок карабін',qty:1,unit:'шт',pricePerUnit:6,totalPrice:6},{name:'Коробочка',qty:1,unit:'шт',pricePerUnit:25,totalPrice:25}];
  // Ensure all items have pricePerUnit
  S.calc.forEach(function(item){
    if(!item.pricePerUnit)item.pricePerUnit=item.price||0;
    item.totalPrice=Math.round((item.qty||0)*(item.pricePerUnit||0)*100)/100;
  });

  var cost=S.calc.reduce(function(s,i){return s+(i.totalPrice||0);},0);

  var UNITS=['шт','м','см','нитка','г','кг','мл'];

  var items=S.calc.map(function(item,i){
    var unitOpts=UNITS.map(function(u){return '<option'+(u===(item.unit||'шт')?' selected':'')+'>'+u+'</option>';}).join('');
    return '<div style="border-bottom:1px solid var(--border);padding:10px 0">'
      // Row 1: name + delete
      +'<div style="display:flex;align-items:center;gap:8px;margin-bottom:6px">'
      +'<input class="fi" style="flex:1;padding:8px 10px;font-size:13px" value="'+esc(item.name||'')+'" oninput="S.calc['+i+'].name=this.value" placeholder="Назва матеріалу"/>'
      +'<button class="bx" onclick="S.calc.splice('+i+',1);render()" style="color:var(--red)">✕</button>'
      +'</div>'
      // Row 2: qty + unit + price per unit = total
      +'<div style="display:flex;align-items:center;gap:6px;flex-wrap:wrap">'
      +'<div style="display:flex;flex-direction:column;gap:2px;min-width:70px">'
      +'<label style="font-size:10px;color:var(--muted);font-weight:600">Кількість</label>'
      +'<input class="fi" type="number" step="0.1" min="0" value="'+item.qty+'" oninput="S.calc['+i+'].qty=+this.value||0;updCalc()" style="padding:7px 8px;font-size:13px;text-align:center"/>'
      +'</div>'
      +'<div style="display:flex;flex-direction:column;gap:2px;min-width:80px">'
      +'<label style="font-size:10px;color:var(--muted);font-weight:600">Одиниця</label>'
      +'<select class="fi" style="padding:7px 8px;font-size:13px" onchange="S.calc['+i+'].unit=this.value;updCalc()">'+unitOpts+'</select>'
      +'</div>'
      +'<div style="display:flex;flex-direction:column;gap:2px;min-width:80px">'
      +'<label id="calc-unit-lbl-'+i+'" style="font-size:10px;color:var(--muted);font-weight:600">Ціна за 1 '+(item.unit||'шт')+'</label>'
      +'<input class="fi" type="number" step="0.01" min="0" value="'+item.pricePerUnit+'" oninput="S.calc['+i+'].pricePerUnit=+this.value||0;updCalc()" style="padding:7px 8px;font-size:13px;text-align:right"/>'
      +'</div>'
      +'<div style="display:flex;flex-direction:column;gap:2px;align-items:center">'
      +'<label style="font-size:10px;color:var(--muted);font-weight:600">= Сума</label>'
      +'<div id="calc-total-'+i+'" style="font-size:14px;font-weight:700;color:var(--dark);padding:7px 8px;min-width:60px;text-align:right">'+(item.totalPrice||0).toFixed(2)+' ₴</div>'
      +'</div>'
      +'</div>'
      +'</div>';
  }).join('');

  return '<div>'+ptitle('Калькулятор','Собівартість прикраси')
    +'<div class="card">'
    +'<div class="ctitle">Матеріали та пакування</div>'
    +'<div style="font-size:12px;color:var(--muted);margin-bottom:12px;padding:8px;background:var(--gold-l);border-radius:8px">💡 Тросик — в сантиметрах (40 см на чокер, 20 см на браслет). Ціна за 1 см = вартість катушки ÷ довжина в см (напр. 40 грн ÷ 4000 см = 0.01 грн/см). Камені — в нитках (0.5, 1, 1.5 нитки).</div>'
    +items
    // Add new item
    +'<div style="margin-top:12px;padding-top:12px;border-top:2px dashed var(--border)">'
    +'<div style="font-size:12px;font-weight:600;color:var(--muted);margin-bottom:8px;text-transform:uppercase;letter-spacing:.5px">Додати матеріал</div>'
    +'<div style="display:flex;gap:6px;flex-wrap:wrap;margin-bottom:6px">'
    +['Тросик ювелірний','Замок карабін','Удлинювач','Колечко','Мішечок','Коробочка','Візитка'].map(function(n){
      return '<button onclick="quickAddCalc(\''+n+'\')" style="background:var(--bg);border:1px solid var(--border);border-radius:6px;padding:3px 8px;font-size:11px;cursor:pointer;color:var(--mid)">+'+n+'</button>';
    }).join('')
    +'</div>'
    +'<div style="display:flex;gap:6px">'
    +'<input class="fi" id="ni-n" placeholder="Назва матеріалу" style="flex:2;padding:9px 11px;font-size:13px"/>'
    +'<input class="fi" type="number" step="0.1" id="ni-q" placeholder="Кіл." style="width:60px;padding:9px 8px;font-size:13px;text-align:center" value="1"/>'
    +'<select class="fi" id="ni-u" style="width:75px;padding:9px 6px;font-size:12px">'
    +UNITS.map(function(u){return '<option>'+u+'</option>';}).join('')
    +'</select>'
    +'<input class="fi" type="number" step="0.01" id="ni-p" placeholder="₴/од" style="width:70px;padding:9px 8px;font-size:13px;text-align:right"/>'
    +'<button class="btn btn-out btn-sm" onclick="addCalcItem()">+</button>'
    +'</div>'
    +'</div>'
    +'</div>'
    +'<div class="cr" id="calc-result">'
    +'<div class="crl">Собівартість</div>'
    +'<div class="crv" id="crv">'+cost.toFixed(2)+' грн</div>'
    +'<div class="popts">'
    +[[3,'Мін'],[4,'Комфорт'],[5,'Преміум']].map(function(m){
      return '<div class="popt"><div class="pol">×'+m[0]+' '+m[1]+'</div><div class="pop" id="po'+m[0]+'">'+(cost*m[0]).toFixed(0)+' ₴</div><div class="pob">прибуток '+(cost*(m[0]-1)).toFixed(0)+' ₴</div></div>';
    }).join('')
    +'</div></div></div>';

function updCalc(){
  S.calc.forEach(function(item,i){
    item.totalPrice=Math.round((item.qty||0)*(item.pricePerUnit||0)*100)/100;

    var totalEl=document.getElementById('calc-total-'+i);
    if(totalEl)totalEl.textContent=item.totalPrice.toFixed(2)+' ₴';

    var unitLbl=document.getElementById('calc-unit-lbl-'+i);
    if(unitLbl)unitLbl.textContent='Ціна за 1 '+(item.unit||'шт');

  [[3,'po3'],[4,'po4'],[5,'po5']].forEach(function(m){
    var e=document.getElementById(m[1]);

function addCalcItem(){
  var n=document.getElementById('ni-n').value.trim();
  var q=+document.getElementById('ni-q').value||1;
  var u=document.getElementById('ni-u').value||'шт';

  if(!n)return;

function calcHelper(){
  var total=+document.getElementById('helper-total').value||0;

function pgFinance(){
  if(!S.finMode)S.finMode='month';

  // Get finance data based on mode
  var fm={};
  var finMonths=[];
  if(S.finMode==='month'){
    fm=getFinance(S.year)[S.month]||{};
    finMonths=[fm];
  } else if(S.finMode==='year'){
    finMonths=getFinance(S.year);
    fm={}; // aggregate below
  } else if(S.finMode==='custom'&&S.finFrom&&S.finTo){
    YEARS.forEach(function(y){
      var yf=getFinance(y);
      MO.forEach(function(mn,mi){
        var ms=y+'-'+String(mi+1).padStart(2,'0')+'-01';
        var me=y+'-'+String(mi+1).padStart(2,'0')+'-31';
        if(ms<=S.finTo&&me>=S.finFrom)finMonths.push(yf[mi]||{});
      });
    });
    fm=finMonths[0]||{};
  } else {
    fm=getFinance(S.year)[S.month]||{};
    finMonths=[fm];
  }

  // Aggregate totals
  var inc=finMonths.reduce(function(s,m){return s+(m.incomeIG||0)+(m.incomeAbout||0)+(m.incomeOther||0);},0);
  var exp=finMonths.reduce(function(s,m){return s+(m.expSalary||0)+(m.expTeam||0)+(m.expMaterials||0)+(m.expFurniture||0)+(m.expPackaging||0)+(m.expDeliveryIn||0)+(m.expAds||0)+(m.expSmm||0)+(m.expPhoto||0)+(m.expStudio||0)+(m.expDeliveryOut||0)+(m.expOther||0);},0);
  var profit=inc-exp;

  // Year totals (always show)
  var yFin=getFinance(S.year);
  var yInc=yFin.reduce(function(s,m){return s+(m.incomeIG||0)+(m.incomeAbout||0)+(m.incomeOther||0);},0);
  var yExp=yFin.reduce(function(s,m){return s+(m.expSalary||0)+(m.expTeam||0)+(m.expMaterials||0)+(m.expFurniture||0)+(m.expPackaging||0)+(m.expDeliveryIn||0)+(m.expAds||0)+(m.expSmm||0)+(m.expPhoto||0)+(m.expStudio||0)+(m.expDeliveryOut||0)+(m.expOther||0);},0);

  // Mode tabs
  var modeTabs=['month','year','custom'].map(function(m){

function pgMarketing(){
  if(!S.marketing)S.marketing={links:[],photoshoots:[]};

  if(!Array.isArray(S.marketing.photoshoots))S.marketing.photoshoots=[];
  var m=S.marketing;

  // Predefined categories
  var MCAT=[
    {key:'instagram', label:'📸 Instagram', icon:'📸'},
    {key:'brandbook', label:'🎨 Брендбук', icon:'🎨'},
    {key:'logo', label:'🔤 Логотип', icon:'🔤'},
    {key:'packaging', label:'📦 Пакування', icon:'📦'},
    {key:'audience', label:'👥 Цільова аудиторія', icon:'👥'},
    {key:'competitors', label:'🔍 Конкуренти', icon:'🔍'},
    {key:'content', label:'🎬 Контент-план', icon:'🎬'},
    {key:'analytics', label:'📊 Аналітика', icon:'📊'},
    {key:'other', label:'📎 Інше', icon:'📎'},
  ];

  // Group links by category
  var grouped={};
  MCAT.forEach(function(c){grouped[c.key]=[];});
  (m.links||[]).forEach(function(l,i){
    var cat=l.category||'other';
    if(!grouped[cat])grouped[cat]=[];
    grouped[cat].push({link:l,idx:i});
  });

  var catCards=MCAT.map(function(cat){
    var items=grouped[cat.key]||[];
    var itemsHtml=items.map(function(item){
      return '<div class="fr" style="align-items:flex-start">'
        +'<div style="flex:1;min-width:0">'

        +'<a href="'+esc(item.link.url)+'" target="_blank" style="font-size:12px;color:var(--gold);font-weight:600;text-decoration:none;word-break:break-all">🔗 '+esc(item.link.url.replace('https://','').slice(0,40))+'...</a>'
        +'</div>'
        +'<button data-dellink="'+item.idx+'" class="bx" style="color:var(--red);flex-shrink:0">🗑️</button>'
        +'</div>';
    }).join('');

    return '<div class="card" style="margin-bottom:12px">'
      +'<div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:'+(items.length?'10px':'0')+'">'

      +'</div>';
  }).join('');

  // ROI

  var igRev=yFin.reduce(function(s,mo){return s+(mo.incomeIG||0);},0);
  var roi=adSpend>0?Math.round(((igRev-adSpend)/adSpend)*100):0;

  // Photoshoots
  var psCards=(m.photoshoots||[]).map(function(ps,i){

      +(ps.models?'<div class="prc-meta">Моделі: '+esc(ps.models)+'</div>':'')

      +'<div style="display:flex;align-items:center;gap:8px">'

      +'<button class="bx" data-delps="'+i+'" style="color:var(--red)">🗑️</button>'
      +'</div></div>'
      +(ps.items?'<div style="font-size:12px;color:var(--muted);margin-bottom:4px">'+esc(ps.items)+'</div>':'')
      +(ps.results?'<div style="font-size:12px;color:var(--muted);margin-bottom:4px">'+esc(ps.results)+'</div>':'')
      +(ps.driveUrl?'<a href="'+esc(ps.driveUrl)+'" target="_blank" style="font-size:12px;color:var(--gold);font-weight:600;text-decoration:none">🔗 Папка з фото</a>':'')
      +'</div>';
  }).join('');

  return '<div>'+ptitle('Маркетинг','Посилання, фотосесії та аналітика')
    // ROI block
    +'<div class="card" style="margin-bottom:14px"><div class="ctitle">📊 ROI реклами '+S.year+'</div>'
    +'<div class="fr"><span class="frl">Витрати на маркетинг</span><span style="font-weight:700;color:var(--red)">'+fmt(adSpend)+'</span></div>'
    +'<div class="fr"><span class="frl">Дохід з Instagram</span><span style="font-weight:700;color:var(--green)">'+fmt(igRev)+'</span></div>'
    +'<div class="ftot"><span class="ftl">ROI реклами</span><span class="ftv" style="color:'+(roi>=0?'var(--gold)':'#E74C3C')+'">'+(roi>=0?'+':'')+roi+'%</span></div>'
    +'</div>'
    // Links by category
    +catCards
    // Photoshoots

    +'</div>';
}

  reader.readAsDataURL(file);
}

function detectCategory(name) {
  var n = (name||'').toLowerCase();
  if(n.includes('браслет')) return 'браслет';
  if(n.includes('чокер')) return 'чокер';
  if(n.includes('колье') || n.includes('кольє')) return 'колье';
  if(n.includes('кольцо') || n.includes('кільце')) return 'кольцо';
  if(n.includes('серьг') || n.includes('сережк')) return 'серьги';
  if(n.includes('брошь') || n.includes('брош')) return 'брошь';
  if(n.includes('комплект')) return 'комплект';
  return 'другое';
}

function renderLocList(){
  var el=document.getElementById('lc-list');if(!el)return;
  el.innerHTML='';
  locItems.forEach(function(l,i){
    var row=document.createElement('div');
    row.style.cssText='display:flex;align-items:center;gap:8px';
    var chip=document.createElement('span');
    chip.className='lchip';chip.style.flex='1';chip.textContent='📍 '+l.loc;
    var inp=document.createElement('input');
    inp.type='number';inp.value=l.qty;
    inp.style.cssText='width:56px;padding:6px 8px;border:1.5px solid var(--border);border-radius:8px;font-size:13px;text-align:center;outline:none';
    inp.addEventListener('change',function(){locItems[i].qty=+this.value||0;});
    var del=document.createElement('button');
    del.className='bx';del.style.color='var(--red)';del.textContent='×';
    del.addEventListener('click',function(){locItems.splice(i,1);renderLocList();});
    row.appendChild(chip);row.appendChild(inp);
    row.appendChild(document.createTextNode('шт'));
    row.appendChild(del);
    el.appendChild(row);
  });
}

function addLoc(){
  var n=document.getElementById('lc-n').value.trim();
  var q=+document.getElementById('lc-q').value||1;
  if(!n||locItems.find(function(l){return l.loc===n;}))return;
  locItems.push({loc:n,qty:q});
  document.getElementById('lc-n').value='';
  document.getElementById('lc-q').value='1';
  renderLocList();
}

function quickLoc(v){
  if(!locItems.find(function(l){return l.loc===v;})){locItems.push({loc:v,qty:1});renderLocList();}
}

    img:document.getElementById('m-im').value.trim()||'💎',
    photo:document.getElementById('m-ph').value||'',
    category:detectCategory(document.getElementById('m-nm').value),
    fittings:document.getElementById('m-fur').value||'',
    fittingsColor:document.getElementById('m-fcol').value||'',
    size:document.getElementById('m-sz').value.trim()||'',
    price1:+document.getElementById('m-p1').value||0,
    cost:+document.getElementById('m-cs').value||0,
    comp2:document.getElementById('m-c2').value.trim(),
    price2:+document.getElementById('m-p2').value||0,
    comp3:document.getElementById('m-c3').value.trim(),
    price3:+document.getElementById('m-p3').value||0,
    stock:+document.getElementById('m-sk').value||0,
    status:document.getElementById('m-st').value,
    locationStock:JSON.parse(JSON.stringify(locItems)),
  };

  scheduleSave();render();
  toast(editId?'Товар оновлено ✓':'Товар додано ✓');
}

function changePurchUsed(id, delta){
  var p=S.purchases.find(function(x){return x.id===id;});

  p.used=Math.max(0,Math.min(p.qty||0,(p.used||0)+delta));

}

var ppLinks=[];
function savePurch(backdrop){
  var date=document.getElementById('pp-d').value.trim();
  var monthIdx=S.pmonth;
  try{monthIdx=parseInt(date.split('.')[1])-1;}catch(e){}
  if(monthIdx<0||monthIdx>11)monthIdx=S.pmonth;
  var p={
    id:Date.now(),
    name:document.getElementById('pp-n').value.trim(),
    supplier:document.getElementById('pp-s').value.trim(),
    date:date,
    amount:+document.getElementById('pp-a').value||0,
    qty:+document.getElementById('pp-q').value||0,
    unit:document.getElementById('pp-u').value,
    quality:+document.getElementById('pp-ql').value,
    buyMore:document.getElementById('pp-b').value,
    comment:document.getElementById('pp-c').value.trim(),
    links:JSON.parse(JSON.stringify(ppLinks)),
    monthIdx:monthIdx,
    year:S.purchYear,
  };
  if(!p.name){alert('Введи название материала');return;}
  S.purchases.push(p);
  // Auto-add to finance expenses
  if(S.finance[p.monthIdx])S.finance[p.monthIdx].expMaterials=(S.finance[p.monthIdx].expMaterials||0)+p.amount;
  backdrop.remove();
  scheduleSave();render();toast('Закупку додано ✓ Расходы обновлены!');
}

function delPurch(id){
  if(confirm('Видалити закупку?')){
    S.purchases=S.purchases.filter(function(x){return x.id!==id;});
    scheduleSave();render();toast('Закупку видалено');
  }
}

// ── AI fill ───────────────────────────────────────────────────────────────────
var aiImg=null;
function onAiFile(input){
  var file=input.files[0];if(!file)return;
  var reader=new FileReader();
  reader.onload=function(e){
    aiImg={data:e.target.result.split(',')[1],type:file.type};
    var w=document.getElementById('ai-pw');
    if(w)w.innerHTML='<img src="'+e.target.result+'" style="width:80px;height:80px;object-fit:cover;border-radius:10px;margin-bottom:6px"/>';
  };
  reader.readAsDataURL(file);
}

async function doAiFill(){
  var text=(document.getElementById('ai-text')||{}).value||'';
  if(!text&&!aiImg){alert('Добавь фото или описание');return;}
  var btn=document.getElementById('ai-btn');
  if(btn){btn.innerHTML='<div class="spin"></div> AI заполняет…';btn.disabled=true;}
  try{
    var content=[];
    if(aiImg)content.push({type:'image',source:{type:'base64',media_type:aiImg.type,data:aiImg.data}});
    content.push({type:'text',text:'Заполни карточку украшения. Верни ТОЛЬКО JSON без markdown:\n{"name":"","desc":"","material":"","price1":0,"comp2":"","price2":0,"comp3":"","price3":0,"stock":1,"status":"Активний","cost":0,"img":"💎"}\n\nИнформация: '+(text||'смотри на фото')});
    var res=await fetch('https://api.anthropic.com/v1/messages',{method:'POST',headers:{'Content-Type':'application/json','anthropic-version':'2023-06-01','anthropic-dangerous-direct-browser-access':'true'},body:JSON.stringify({model:'claude-sonnet-4-6',max_tokens:1000,messages:[{role:'user',content:content}]})});
    var data=await res.json();
    var raw=(data.content||[]).find(function(b){return b.type==='text';});
    if(raw){var parsed=JSON.parse(raw.text.replace(/```json?|```/g,'').trim());openProductModal(parsed);toast('AI заполнил карточку ✓');}
  }catch(e){alert('Помилка AI: '+e.message);}
  if(btn){btn.innerHTML='✨ Заповнити через AI';btn.disabled=false;}
}
